name: Farcaster Video Check (read-only)

on:
  workflow_dispatch:
    inputs:
      count:
        description: Number of upcoming videos to check
        type: choice
        options: ['1', '3', '5']
        default: '3'
      video_url:
        description: Optional source MP4 or HLS URL; leave blank to check upcoming videos
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /package.json
            /package-lock.json
            /scripts/farcaster-scheduled-executor.ts
            /scripts/farcaster-video-validation.ts
            /scripts/farcaster-video-preflight.ts
            /scripts/farcaster-hls-assets.json
            /scripts/viz-farcaster-posts.json
            /scripts/viz-publishing.ts
            /scripts/viz-queue-time.mjs
            /src/lib/social-video.ts

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Prepare playback validation
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          echo "FARCASTER_MEDIA_REVISION=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Verify live media and Farcaster client receipts
        env:
          NEYNAR_API_KEY: ${{ secrets.NEYNAR_API_KEY }}
          VIZ_MEDIA_BASE_URL: ${{ vars.VIZ_MEDIA_BASE_URL }}
          FARCASTER_MEDIA_PROXY_BASE_URL: ${{ vars.FARCASTER_MEDIA_PROXY_BASE_URL }}
          VIDEO_URL: ${{ inputs.video_url }}
          NEXT_COUNT: ${{ inputs.count }}
        run: |
          if [ -n "$VIDEO_URL" ]; then
            npx tsx scripts/farcaster-video-preflight.ts --url="$VIDEO_URL"
          else
            npx tsx scripts/farcaster-video-preflight.ts --next="$NEXT_COUNT"
          fi
