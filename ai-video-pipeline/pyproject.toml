[project]
name = "ai-video-pipeline"
version = "0.1.0"
description = "AI Avatar News Reel Generator - Python Backend Pipeline"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Vedang Vatsa" }]

dependencies = [
    # --- News Aggregation ---
    "feedparser>=6.0.11",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.3",
    "readability-lxml>=0.8.1",

    # --- Script Generation (Ollama) ---
    "ollama>=0.4.0",

    # --- TTS (Voice Generation) ---
    "edge-tts>=6.1.12",          # Fallback TTS (Microsoft Edge, no GPU needed)
    "soundfile>=0.12.1",
    "numpy>=1.26.0",

    # --- Timestamps (WhisperX / stable-ts) ---
    "faster-whisper>=1.1.0",
    "stable-ts>=2.16.0",

    # --- General Utilities ---
    "pyyaml>=6.0.2",
    "pydantic>=2.9.0",
    "rich>=13.9.0",
    "click>=8.1.7",

    # --- Async ---
    "aiofiles>=24.1.0",
    "aiohttp>=3.10.0",
]

[project.optional-dependencies]
# Chatterbox TTS (requires PyTorch) - install separately for Apple Silicon
chatterbox = [
    "chatterbox-tts>=0.1.0",
]

# F5-TTS MLX variant for Apple Silicon
f5tts = [
    "f5-tts-mlx>=0.3.0",
]

# Full dev dependencies
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[project.scripts]
ai-pipeline = "scripts.orchestrator:main"

[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "SIM"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
