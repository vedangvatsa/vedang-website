<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 120 120" fill="none"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description><dc:creator>RealFaviconGenerator</dc:creator><dc:source>https://realfavicongenerator.net</dc:source></rdf:Description></rdf:RDF></metadata><defs>
    <!-- Primary Brand Gradient for the main speech bubble -->
    <linearGradient id="brandGradient" x1="10" y1="15" x2="110" y2="107" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff7eb3"></stop> <!-- Lighter highlight -->
      <stop offset="100%" stop-color="#ff52a1"></stop> <!-- Official Brand Pink -->
    </linearGradient>

    <!-- Outer Glow Filter to mimic the neon/app UI feel -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="3.5" result="blur"></feGaussianBlur>
      <feFlood flood-color="#ff52a1" flood-opacity="0.6" result="color"></feFlood>
      <feComposite in="color" in2="blur" operator="in" result="glow"></feComposite>
      <feMerge>
        <feMergeNode in="glow"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>
  </defs><path d="M 60,15 C 32,15 10,34 10,58 C 10,71 16,83 26,91 L 18,110 L 40,103 C 46,106 53,107 60,107 C 88,107 110,88 110,58 C 110,28 88,15 60,15 Z" fill="url(#brandGradient)" filter="url(#neonGlow)"></path><circle cx="60" cy="58" r="18" fill="#090a0f"></circle><circle cx="55" cy="58" r="4.5" fill="#ff52a1"></circle><circle cx="66" cy="58" r="4.5" fill="#6d5dfc"></circle></svg>