<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" fill="none">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap');
    text { font-family: 'Inter', -apple-system, sans-serif; }
  </style>

  <!-- Background -->
  <rect width="960" height="520" rx="4" fill="#ffffff" stroke="#e3e3e0" stroke-width="1"/>

  <!-- Title Bar -->
  <rect x="0" y="0" width="960" height="56" rx="4" fill="#37352f"/>
  <text x="32" y="36" fill="#ffffff" font-size="18" font-weight="800" letter-spacing="-0.3">AGENTIC AI FUNDING LANDSCAPE</text>
  <text x="960" y="36" fill="#ffffff" font-size="11" font-weight="500" text-anchor="end" opacity="0.6" dx="-32">Source: Company disclosures, PitchBook · Mid-2026</text>

  <!-- Panel 1: Funding Velocity -->
  <rect x="24" y="72" width="296" height="420" rx="3" fill="#f7f6f3" stroke="#e3e3e0" stroke-width="1"/>
  <text x="44" y="100" fill="#37352f" font-size="11" font-weight="700" letter-spacing="1.5" text-transform="uppercase">FUNDING VELOCITY</text>
  <text x="44" y="116" fill="#37352f" font-size="10" font-weight="400" opacity="0.5">Disclosed equity, pure-play agentic AI</text>

  <!-- 2024 bar -->
  <text x="44" y="150" fill="#37352f" font-size="11" font-weight="600">2024</text>
  <rect x="44" y="158" width="120" height="28" rx="4" fill="#2563eb" opacity="0.5"/>
  <text x="172" y="177" fill="#37352f" font-size="13" font-weight="700" dx="8">$1.5B</text>
  <text x="44" y="200" fill="#37352f" font-size="10" opacity="0.5">31 deals</text>

  <!-- 2025 bar -->
  <text x="44" y="230" fill="#37352f" font-size="11" font-weight="600">2025</text>
  <rect x="44" y="238" width="232" height="28" rx="4" fill="#2563eb" opacity="0.65"/>
  <text x="172" y="257" fill="#ffffff" font-size="13" font-weight="700" dx="64">$2.9B</text>
  <text x="44" y="280" fill="#37352f" font-size="10" opacity="0.5">50 deals · +93% YoY</text>

  <!-- 2026 bar -->
  <text x="44" y="310" fill="#37352f" font-size="11" font-weight="600">Jan-May 2026</text>
  <rect x="44" y="318" width="88" height="28" rx="4" fill="#2563eb" opacity="0.8"/>
  <text x="140" y="337" fill="#37352f" font-size="13" font-weight="700" dx="8">$1.1B</text>
  <text x="44" y="360" fill="#37352f" font-size="10" opacity="0.5">29 deals in 5 months</text>

  <!-- Annualized projection -->
  <rect x="44" y="375" width="248" height="32" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1" stroke-dasharray="4 2"/>
  <text x="56" y="396" fill="#92400e" font-size="11" font-weight="600">~$2.6B annualized pace</text>

  <!-- Deal growth callout -->
  <rect x="44" y="420" width="248" height="56" rx="4" fill="#ffffff" stroke="#e3e3e0" stroke-width="1"/>
  <text x="56" y="442" fill="#37352f" font-size="10" font-weight="700">Deal activity nearly doubled:</text>
  <text x="56" y="462" fill="#37352f" font-size="10" opacity="0.6">31 deals (2024) → 50 deals (2025)</text>

  <!-- Panel 2: Capital Concentration -->
  <rect x="332" y="72" width="296" height="420" rx="3" fill="#f7f6f3" stroke="#e3e3e0" stroke-width="1"/>
  <text x="352" y="100" fill="#37352f" font-size="11" font-weight="700" letter-spacing="1.5">CAPITAL CONCENTRATION</text>
  <text x="352" y="116" fill="#37352f" font-size="10" font-weight="400" opacity="0.5">Share of total funding by deal rank</text>

  <!-- Donut-style visualization using stacked arcs -->
  <!-- Outer ring segments -->
  <g transform="translate(480, 220)">
    <!-- Top 3 deals: 44% -->
    <circle cx="0" cy="0" r="72" fill="none" stroke="#dc2626" stroke-width="28" stroke-dasharray="199 254" stroke-dashoffset="0" opacity="0.85"/>
    <!-- Deals 4-10: 34% -->
    <circle cx="0" cy="0" r="72" fill="none" stroke="#f97316" stroke-width="28" stroke-dasharray="154 299" stroke-dashoffset="-199" opacity="0.7"/>
    <!-- Bottom 50%: 11.5% -->
    <circle cx="0" cy="0" r="72" fill="none" stroke="#d1d5db" stroke-width="28" stroke-dasharray="52 401" stroke-dashoffset="-353"/>
    <!-- Remaining: 10.5% -->
    <circle cx="0" cy="0" r="72" fill="none" stroke="#e5e7eb" stroke-width="28" stroke-dasharray="48 405" stroke-dashoffset="-405"/>

    <!-- Center text -->
    <text x="0" y="-8" fill="#37352f" font-size="22" font-weight="800" text-anchor="middle">78%</text>
    <text x="0" y="12" fill="#37352f" font-size="10" font-weight="500" text-anchor="middle" opacity="0.6">top 10 deals</text>
  </g>

  <!-- Legend -->
  <rect x="352" y="320" width="12" height="12" rx="2" fill="#dc2626" opacity="0.85"/>
  <text x="372" y="331" fill="#37352f" font-size="11" font-weight="600">44%</text>
  <text x="400" y="331" fill="#37352f" font-size="11" opacity="0.6">Top 3 deals</text>

  <rect x="352" y="344" width="12" height="12" rx="2" fill="#f97316" opacity="0.7"/>
  <text x="372" y="355" fill="#37352f" font-size="11" font-weight="600">34%</text>
  <text x="400" y="355" fill="#37352f" font-size="11" opacity="0.6">Deals 4-10</text>

  <rect x="352" y="368" width="12" height="12" rx="2" fill="#d1d5db"/>
  <text x="372" y="379" fill="#37352f" font-size="11" font-weight="600">11.5%</text>
  <text x="412" y="379" fill="#37352f" font-size="11" opacity="0.6">Bottom 50%</text>

  <rect x="352" y="392" width="12" height="12" rx="2" fill="#e5e7eb"/>
  <text x="372" y="403" fill="#37352f" font-size="11" font-weight="600">10.5%</text>
  <text x="412" y="403" fill="#37352f" font-size="11" opacity="0.6">Remaining</text>

  <!-- Callout box -->
  <rect x="352" y="420" width="260" height="56" rx="4" fill="#ffffff" stroke="#e3e3e0" stroke-width="1"/>
  <text x="364" y="442" fill="#37352f" font-size="10" font-weight="700">Winner-takes-most pattern:</text>
  <text x="364" y="462" fill="#37352f" font-size="10" opacity="0.6">Bottom half splits just 11.5% of capital</text>

  <!-- Panel 3: Category + Geography -->
  <rect x="640" y="72" width="296" height="200" rx="3" fill="#f7f6f3" stroke="#e3e3e0" stroke-width="1"/>
  <text x="660" y="100" fill="#37352f" font-size="11" font-weight="700" letter-spacing="1.5">WHERE CAPITAL GOES</text>
  <text x="660" y="116" fill="#37352f" font-size="10" font-weight="400" opacity="0.5">% of agentic AI funding, early 2026</text>

  <!-- Vertical agents bar -->
  <text x="660" y="144" fill="#37352f" font-size="10" font-weight="600">Vertical agents</text>
  <rect x="660" y="150" width="192" height="18" rx="3" fill="#059669" opacity="0.6"/>
  <text x="860" y="164" fill="#37352f" font-size="11" font-weight="700" dx="4">55%</text>

  <!-- Infrastructure bar -->
  <text x="660" y="188" fill="#37352f" font-size="10" font-weight="600">Execution infrastructure</text>
  <rect x="660" y="194" width="105" height="18" rx="3" fill="#7c3aed" opacity="0.6"/>
  <text x="773" y="208" fill="#37352f" font-size="11" font-weight="700" dx="4">~30%</text>

  <!-- Platforms bar -->
  <text x="660" y="232" fill="#37352f" font-size="10" font-weight="600">Dev platforms</text>
  <rect x="660" y="238" width="53" height="18" rx="3" fill="#d97706" opacity="0.6"/>
  <text x="721" y="252" fill="#37352f" font-size="11" font-weight="700" dx="4">~15%</text>

  <!-- Panel 4: Geography -->
  <rect x="640" y="284" width="296" height="100" rx="3" fill="#f7f6f3" stroke="#e3e3e0" stroke-width="1"/>
  <text x="660" y="312" fill="#37352f" font-size="11" font-weight="700" letter-spacing="1.5">GEOGRAPHY</text>

  <!-- US bar -->
  <rect x="660" y="324" width="216" height="14" rx="3" fill="#2563eb" opacity="0.5"/>
  <text x="660" y="352" fill="#37352f" font-size="10" font-weight="600">US: 82%</text>

  <!-- Europe bar -->
  <rect x="660" y="358" width="30" height="10" rx="3" fill="#059669" opacity="0.5"/>
  <text x="696" y="367" fill="#37352f" font-size="10" font-weight="500" opacity="0.6">Europe: ~11%</text>
  <text x="808" y="367" fill="#37352f" font-size="10" font-weight="500" opacity="0.6">Other: ~7%</text>

  <!-- Panel 5: Key Metrics -->
  <rect x="640" y="396" width="296" height="96" rx="3" fill="#37352f"/>

  <!-- Metric 1 -->
  <text x="660" y="424" fill="#ffffff" font-size="22" font-weight="800">80-90%</text>
  <text x="660" y="442" fill="#ffffff" font-size="10" font-weight="400" opacity="0.6">of wrapper startups projected to fail</text>

  <!-- Metric 2 -->
  <text x="660" y="472" fill="#ffffff" font-size="22" font-weight="800">12</text>
  <text x="694" y="472" fill="#ffffff" font-size="10" font-weight="400" opacity="0.6">acquisitions (Oct 2024 - May 2026)</text>

  <!-- Median seed -->
  <text x="840" y="424" fill="#ffffff" font-size="22" font-weight="800">$4.6M</text>
  <text x="840" y="442" fill="#ffffff" font-size="10" font-weight="400" opacity="0.6">median AI seed</text>
</svg>
