<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" font-family="'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif">
  <rect width="900" height="320" fill="white" rx="3"/>
  <rect width="900" height="320" fill="white" rx="3" stroke="#e3e3e0" stroke-width="1"/>

  <!-- Title -->
  <text x="450" y="36" text-anchor="middle" fill="#37352f" font-size="18" font-weight="700" letter-spacing="-0.3">The Agent Infrastructure Stack</text>
  <text x="450" y="54" text-anchor="middle" fill="#37352f" opacity="0.4" font-size="10" letter-spacing="0.5">EIGHT LAYERS · $5B+ IN VENTURE CAPITAL · MID-2026</text>

  <!-- Stack layers (bottom to top, drawn top to bottom visually) -->

  <!-- Layer 1: Compute -->
  <rect x="60" y="75" width="780" height="28" rx="4" fill="#2563eb" opacity="0.08" stroke="#2563eb" stroke-opacity="0.2"/>
  <text x="80" y="94" fill="#2563eb" font-size="10" font-weight="700">COMPUTE &amp; INFERENCE</text>
  <text x="440" y="94" fill="#37352f" opacity="0.5" font-size="9">Together AI · Modal · Fireworks · Groq · Cerebras</text>
  <text x="820" y="94" text-anchor="end" fill="#2563eb" font-size="9" font-weight="700">$4B+</text>

  <!-- Layer 2: Orchestration -->
  <rect x="60" y="107" width="780" height="28" rx="4" fill="#7c3aed" opacity="0.08" stroke="#7c3aed" stroke-opacity="0.2"/>
  <text x="80" y="126" fill="#7c3aed" font-size="10" font-weight="700">ORCHESTRATION</text>
  <text x="440" y="126" fill="#37352f" opacity="0.5" font-size="9">Temporal · Inngest · Composio</text>
  <text x="820" y="126" text-anchor="end" fill="#7c3aed" font-size="9" font-weight="700">$709M</text>

  <!-- Layer 3: Vector / RAG -->
  <rect x="60" y="139" width="780" height="28" rx="4" fill="#059669" opacity="0.08" stroke="#059669" stroke-opacity="0.2"/>
  <text x="80" y="158" fill="#059669" font-size="10" font-weight="700">VECTOR / RAG</text>
  <text x="440" y="158" fill="#37352f" opacity="0.5" font-size="9">Pinecone · Qdrant · Weaviate · Chroma</text>
  <text x="820" y="158" text-anchor="end" fill="#059669" font-size="9" font-weight="700">$312M</text>

  <!-- Layer 4: Evaluation -->
  <rect x="60" y="171" width="780" height="28" rx="4" fill="#d97706" opacity="0.08" stroke="#d97706" stroke-opacity="0.2"/>
  <text x="80" y="190" fill="#d97706" font-size="10" font-weight="700">EVALUATION &amp; OBSERVABILITY</text>
  <text x="440" y="190" fill="#37352f" opacity="0.5" font-size="9">Braintrust · Langfuse · Arize AI</text>
  <text x="820" y="190" text-anchor="end" fill="#d97706" font-size="9" font-weight="700">$256M</text>

  <!-- Layer 5: Security -->
  <rect x="60" y="203" width="780" height="28" rx="4" fill="#dc2626" opacity="0.08" stroke="#dc2626" stroke-opacity="0.2"/>
  <text x="80" y="222" fill="#dc2626" font-size="10" font-weight="700">SECURITY</text>
  <text x="440" y="222" fill="#37352f" opacity="0.5" font-size="9">Lakera → Check Point · Robust Intel. → Cisco · Galileo → Cisco · Patronus</text>
  <text x="820" y="222" text-anchor="end" fill="#dc2626" font-size="9" font-weight="700">$182M</text>

  <!-- Layer 6: Perception -->
  <rect x="60" y="235" width="780" height="28" rx="4" fill="#0891b2" opacity="0.08" stroke="#0891b2" stroke-opacity="0.2"/>
  <text x="80" y="254" fill="#0891b2" font-size="10" font-weight="700">PERCEPTION</text>
  <text x="440" y="254" fill="#37352f" opacity="0.5" font-size="9">Browserbase · Firecrawl · Apify</text>
  <text x="820" y="254" text-anchor="end" fill="#0891b2" font-size="9" font-weight="700">$87M</text>

  <!-- Layer 7: Memory &amp; State -->
  <rect x="60" y="267" width="380" height="28" rx="4" fill="#4f46e5" opacity="0.08" stroke="#4f46e5" stroke-opacity="0.2"/>
  <text x="80" y="286" fill="#4f46e5" font-size="10" font-weight="700">MEMORY &amp; STATE</text>
  <text x="240" y="286" fill="#37352f" opacity="0.5" font-size="9">Mem0 · Upstash · Pinecone</text>
  <text x="425" y="286" text-anchor="end" fill="#4f46e5" font-size="9" font-weight="700">$36M</text>

  <!-- Layer 8: Sandboxed Execution -->
  <rect x="460" y="267" width="380" height="28" rx="4" fill="#374151" opacity="0.08" stroke="#374151" stroke-opacity="0.2"/>
  <text x="480" y="286" fill="#374151" font-size="10" font-weight="700">SANDBOXED EXECUTION</text>
  <text x="660" y="286" fill="#37352f" opacity="0.5" font-size="9">E2B</text>
  <text x="825" y="286" text-anchor="end" fill="#374151" font-size="9" font-weight="700">$32M</text>

  <!-- Footer -->
  <line x1="60" y1="305" x2="840" y2="305" stroke="#e3e3e0" stroke-width="0.5"/>
  <text x="450" y="315" text-anchor="middle" fill="#37352f" opacity="0.3" font-size="8">Sources: Tracxn, PitchBook, Crunchbase, company announcements. Funding = combined capital raised by companies in each layer.</text>
</svg>
