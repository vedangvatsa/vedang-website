<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 420" width="400" height="420" preserveAspectRatio="xMidYMid meet">
  <style>
    text { font-family: Inter, system-ui, sans-serif; }
    .title { font-size: 16px; font-weight: 600; fill: #18181b; }
    .name { font-size: 15px; font-weight: 600; fill: #18181b; }
    .row { font-size: 13px; fill: #18181b; }
    .dim { font-size: 12px; fill: #52525b; }
    .note { font-size: 12px; fill: #52525b; }
  </style>

  <text x="16" y="28" class="title">Three ways the agent talks</text>

  <rect x="16" y="44" width="368" height="100" fill="#f4f4f5"/>
  <text x="28" y="70" class="name">Agent to site</text>
  <text x="28" y="92" class="row">Buyer agent to merchant website or API</text>
  <text x="28" y="114" class="dim">The merchant may not know the buyer is a machine</text>

  <rect x="16" y="144" width="368" height="100" fill="#ffffff"/>
  <text x="28" y="170" class="name">Agent to agent</text>
  <text x="28" y="192" class="row">Buyer agent to seller agent</text>
  <text x="28" y="214" class="dim">Price, stock, and terms in a protocol, not a page</text>

  <rect x="16" y="244" width="368" height="100" fill="#f4f4f5"/>
  <text x="28" y="270" class="name">Brokered</text>
  <text x="28" y="292" class="row">Buyer agent to a broker, then many stores</text>
  <text x="28" y="314" class="dim">One query, many merchants, one answer</text>

  <text x="16" y="380" class="note">Source: McKinsey, The agentic commerce opportunity, Oct 2025.</text>
  <text x="16" y="400" class="note">veda.ng</text>
</svg>
