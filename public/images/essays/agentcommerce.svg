<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" preserveAspectRatio="xMidYMid meet">
  <style>
    text { font-family: Inter, system-ui, sans-serif; }
    .title { font-size: 16px; font-weight: 600; fill: #18181b; }
    .name { font-size: 14px; font-weight: 600; fill: #18181b; }
    .dim { font-size: 12px; fill: #52525b; }
  </style>

  <text x="24" y="36" class="title">Two paths to a purchase</text>

  <rect x="24" y="60" width="160" height="56" fill="#f4f4f5"/>
  <text x="104" y="94" text-anchor="middle" class="name">Human</text>
  <line x1="184" y1="88" x2="616" y2="88" stroke="#18181b" stroke-width="1"/>
  <text x="400" y="78" text-anchor="middle" class="dim">Browser, cart, checkout</text>
  <rect x="616" y="60" width="160" height="56" fill="#f4f4f5"/>
  <text x="696" y="94" text-anchor="middle" class="name">Merchant site</text>

  <line x1="104" y1="116" x2="104" y2="248" stroke="#18181b" stroke-width="1"/>
  <line x1="696" y1="116" x2="696" y2="248" stroke="#18181b" stroke-width="1"/>
  <text x="400" y="200" text-anchor="middle" class="dim">You delegate. The agent transacts.</text>

  <rect x="24" y="248" width="160" height="56" fill="#ffffff" stroke="#18181b" stroke-width="1"/>
  <text x="104" y="282" text-anchor="middle" class="name">Buyer agent</text>
  <line x1="184" y1="276" x2="616" y2="276" stroke="#18181b" stroke-width="1.5"/>
  <text x="400" y="266" text-anchor="middle" class="dim">HTTP, protocol, tokenized pay</text>
  <rect x="616" y="248" width="160" height="56" fill="#ffffff" stroke="#18181b" stroke-width="1"/>
  <text x="696" y="282" text-anchor="middle" class="name">Seller API</text>

  <text x="24" y="360" class="dim">The second path does not load a page. It sends a request and a payment.</text>
  <text x="24" y="382" class="dim">veda.ng</text>
</svg>
