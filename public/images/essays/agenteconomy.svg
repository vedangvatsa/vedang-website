<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <!-- Background -->
  <rect width="800" height="400" fill="#ffffff" />

  <!-- ============ LEFT PANEL: Market Data Card ============ -->
  <rect x="30" y="28" width="350" height="344" rx="6" fill="#ffffff" stroke="#e3e3e0" stroke-width="1.5" />

  <!-- Card header bar -->
  <rect x="30" y="28" width="350" height="6" rx="3" fill="#3b82f6" />

  <!-- Section label -->
  <text x="50" y="62" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="600" fill="#3b82f6" letter-spacing="1.5">AI AGENT MARKET</text>

  <!-- Big number: 2025 -->
  <text x="50" y="108" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="44" font-weight="800" fill="#37352f">$7.5B</text>
  <text x="240" y="96" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#787774">2025</text>
  <text x="240" y="112" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#787774">market size</text>

  <!-- Divider -->
  <line x1="50" y1="126" x2="360" y2="126" stroke="#e3e3e0" stroke-width="1" />

  <!-- Big number: 2030 -->
  <text x="50" y="172" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="44" font-weight="800" fill="#3b82f6">$50B+</text>
  <text x="260" y="160" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#787774">projected</text>
  <text x="260" y="176" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#787774">by 2030</text>

  <!-- CAGR badge -->
  <rect x="50" y="192" width="112" height="28" rx="14" fill="#3b82f6" opacity="0.08" />
  <text x="106" y="211" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" fill="#3b82f6" text-anchor="middle">33-46% CAGR</text>

  <!-- Divider -->
  <line x1="50" y1="238" x2="360" y2="238" stroke="#e3e3e0" stroke-width="1" />

  <!-- Enterprise adoption stat -->
  <text x="50" y="264" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="600" fill="#787774" letter-spacing="1">ENTERPRISE ADOPTION</text>

  <!-- Progress bar background -->
  <rect x="50" y="276" width="310" height="14" rx="7" fill="#f0f0ee" />
  <!-- Progress bar fill (79%) -->
  <rect x="50" y="276" width="245" height="14" rx="7" fill="#3b82f6" opacity="0.75" />
  <!-- Percentage label -->
  <text x="302" y="288" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="800" fill="#37352f">79%</text>

  <text x="50" y="310" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#787774">of enterprises deploying or piloting AI agents</text>

  <!-- Coase reference -->
  <rect x="50" y="326" width="310" height="34" rx="4" fill="#f7f7f5" />
  <text x="60" y="342" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="600" fill="#37352f">Coase's Theory (1937):</text>
  <text x="60" y="354" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="400" fill="#787774">Transaction costs collapsing, firms restructuring</text>

  <!-- ============ VERTICAL DIVIDER ============ -->
  <line x1="410" y1="50" x2="410" y2="350" stroke="#e3e3e0" stroke-width="1" stroke-dasharray="4,4" />

  <!-- ============ RIGHT PANEL: Impact Data ============ -->

  <!-- Section label -->
  <text x="435" y="56" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="600" fill="#3b82f6" letter-spacing="1.5">ECONOMIC IMPACT</text>

  <!-- Comparison: Traditional vs Agent-Augmented -->
  <text x="435" y="82" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" fill="#37352f">Workforce Cost Structure</text>

  <!-- Bar 1: Traditional Corp -->
  <text x="435" y="104" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="400" fill="#787774">Traditional Corporation</text>
  <rect x="435" y="110" width="320" height="18" rx="3" fill="#37352f" opacity="0.12" />
  <text x="745" y="123" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="600" fill="#37352f" text-anchor="end">100%</text>

  <!-- Bar 2: Agent-Augmented -->
  <text x="435" y="150" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="400" fill="#787774">Agent-Augmented Organization</text>
  <rect x="435" y="156" width="320" height="18" rx="3" fill="#e3e3e0" opacity="0.4" />
  <rect x="435" y="156" width="170" height="18" rx="3" fill="#3b82f6" opacity="0.65" />
  <text x="612" y="169" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="700" fill="#3b82f6">~53%</text>

  <!-- Savings annotation -->
  <text x="605" y="195" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="500" fill="#3b82f6" text-anchor="middle">~47% cost reduction</text>

  <!-- Divider -->
  <line x1="435" y1="212" x2="765" y2="212" stroke="#e3e3e0" stroke-width="1" />

  <!-- Case Study: Klarna -->
  <text x="435" y="236" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="600" fill="#787774" letter-spacing="1">CASE STUDY: KLARNA (2024)</text>

  <!-- Klarna stat cards - side by side -->
  <rect x="435" y="250" width="155" height="80" rx="4" fill="#f7f7f5" />
  <text x="512" y="282" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="800" fill="#37352f" text-anchor="middle">700</text>
  <text x="512" y="302" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="400" fill="#787774" text-anchor="middle">FTE equivalent</text>
  <text x="512" y="316" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="400" fill="#787774" text-anchor="middle">replaced by AI agents</text>

  <rect x="600" y="250" width="155" height="80" rx="4" fill="#f7f7f5" />
  <text x="677" y="282" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="800" fill="#3b82f6" text-anchor="middle">$40M</text>
  <text x="677" y="302" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="400" fill="#787774" text-anchor="middle">annual savings</text>
  <text x="677" y="316" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="400" fill="#787774" text-anchor="middle">from agent deployment</text>

  <!-- Source line -->
  <text x="600" y="352" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="9" font-weight="400" fill="#787774" opacity="0.6" text-anchor="middle">Sources: MarketsandMarkets, BCC Research, Gartner, Klarna</text>

  <!-- ============ ATTRIBUTION ============ -->
  <text x="768" y="390" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#787774" text-anchor="end">@vedangvatsa</text>
</svg>