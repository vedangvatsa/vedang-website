<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560">
  <title>Machine-readability adoption rates</title>
  <rect width="1200" height="560" fill="#ffffff"/>
  <g font-family="Inter, Arial, sans-serif">
    <text x="48" y="48" font-size="28" font-weight="700" fill="#18181b">Machine-readability adoption</text>
    <text x="48" y="78" font-size="16" fill="#71717a">Share of 50,000 audited domains</text>
    <line x1="48" y1="104" x2="1152" y2="104" stroke="#e3e3e0"/>
    <g font-size="16" fill="#18181b">
      <text x="48" y="150">robots.txt AI policy</text><rect x="320" y="130" width="700" height="22" fill="#f4f4f5"/><rect x="320" y="130" width="681" height="22" fill="#18181b"/><text x="1128" y="150" font-weight="700" text-anchor="end">43.76%</text>
      <text x="48" y="198">Both bot identities served</text><rect x="320" y="178" width="700" height="22" fill="#f4f4f5"/><rect x="320" y="178" width="588" height="22" fill="#18181b"/><text x="1128" y="198" font-weight="700" text-anchor="end">37.82%</text>
      <text x="48" y="246">JSON-LD structured data</text><rect x="320" y="226" width="700" height="22" fill="#f4f4f5"/><rect x="320" y="226" width="333" height="22" fill="#18181b"/><text x="1128" y="246" font-weight="700" text-anchor="end">21.37%</text>
      <text x="48" y="294">Author E-E-A-T signals</text><rect x="320" y="274" width="700" height="22" fill="#f4f4f5"/><rect x="320" y="274" width="215" height="22" fill="#18181b"/><text x="1128" y="294" font-weight="700" text-anchor="end">13.82%</text>
      <text x="48" y="342">llms.txt catalog</text><rect x="320" y="322" width="700" height="22" fill="#f4f4f5"/><rect x="320" y="322" width="103" height="22" fill="#18181b"/><text x="1128" y="342" font-weight="700" text-anchor="end">6.62%</text>
      <text x="48" y="390">security.txt</text><rect x="320" y="370" width="700" height="22" fill="#f4f4f5"/><rect x="320" y="370" width="71" height="22" fill="#18181b"/><text x="1128" y="390" font-weight="700" text-anchor="end">4.58%</text>
      <text x="48" y="438">Markdown negotiation</text><rect x="320" y="418" width="700" height="22" fill="#f4f4f5"/><rect x="320" y="418" width="46" height="22" fill="#18181b"/><text x="1128" y="438" font-weight="700" text-anchor="end">2.95%</text>
      <text x="48" y="486">Live MCP server</text><rect x="320" y="466" width="700" height="22" fill="#f4f4f5"/><rect x="320" y="466" width="28" height="22" fill="#18181b"/><text x="1128" y="486" font-weight="700" text-anchor="end">1.82%</text>
    </g>
    <text x="48" y="534" font-family="Inter, Arial, sans-serif" font-size="14" fill="#71717a">OpenAPI specifications and machine payments each appear on fewer than 1% of audited domains.</text>
  </g>
</svg>
