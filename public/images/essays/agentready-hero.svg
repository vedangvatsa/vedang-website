<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <title>Agent-readiness census</title>
  <rect width="1200" height="320" fill="#ffffff"/>
  <g font-family="Inter, Arial, sans-serif">
    <text x="48" y="48" font-size="16" font-weight="600" fill="#71717a" letter-spacing="0.06em">50,000 DOMAINS</text>
    <text x="48" y="92" font-size="34" font-weight="700" fill="#18181b">The web is not ready for agents</text>
    <text x="48" y="128" font-size="18" fill="#52525b">61 deterministic checks across the Tranco top-1M sample</text>
    <line x1="48" y1="156" x2="1152" y2="156" stroke="#e3e3e0"/>
    <text x="48" y="198" font-size="14" font-weight="600" fill="#71717a">MEAN READINESS</text>
    <text x="48" y="250" font-size="48" font-weight="700" fill="#18181b">25.7</text>
    <text x="48" y="282" font-size="16" fill="#52525b">out of 100</text>
    <line x1="400" y1="180" x2="400" y2="290" stroke="#e3e3e0"/>
    <text x="440" y="198" font-size="14" font-weight="600" fill="#71717a">LLMS.TXT</text>
    <text x="440" y="250" font-size="48" font-weight="700" fill="#18181b">6.62%</text>
    <text x="440" y="282" font-size="16" fill="#52525b">publish a valid index</text>
    <line x1="800" y1="180" x2="800" y2="290" stroke="#e3e3e0"/>
    <text x="840" y="198" font-size="14" font-weight="600" fill="#71717a">LIVE MCP</text>
    <text x="840" y="250" font-size="48" font-weight="700" fill="#18181b">1.82%</text>
    <text x="840" y="282" font-size="16" fill="#52525b">expose an endpoint</text>
  </g>
</svg>
