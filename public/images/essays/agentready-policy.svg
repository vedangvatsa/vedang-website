<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="210" viewBox="0 0 1200 210">
  <title>Declared policy and observed HTTP response</title>
  <rect width="1200" height="210" fill="#ffffff"/>
  <g font-family="Inter, Arial, sans-serif">
    <text x="48" y="38" font-size="14" font-weight="600" fill="#71717a">DECLARED POLICY · EDGE RESPONSE</text>
    <line x1="48" y1="58" x2="1152" y2="58" stroke="#e3e3e0"/>
    <text x="48" y="96" font-size="14" font-weight="600" fill="#71717a">POLICY ALLOWS</text>
    <text x="48" y="148" font-size="46" font-weight="700" fill="#18181b">21.1%</text>
    <text x="48" y="180" font-size="15" fill="#52525b">still refuse</text>
    <line x1="400" y1="78" x2="400" y2="188" stroke="#e3e3e0"/>
    <text x="440" y="96" font-size="14" font-weight="600" fill="#71717a">POLICY RESTRICTS</text>
    <text x="440" y="148" font-size="46" font-weight="700" fill="#18181b">28.4%</text>
    <text x="440" y="180" font-size="15" fill="#52525b">still serve</text>
    <line x1="800" y1="78" x2="800" y2="188" stroke="#e3e3e0"/>
    <text x="840" y="96" font-size="14" font-weight="600" fill="#71717a">NO POLICY</text>
    <text x="840" y="148" font-size="46" font-weight="700" fill="#18181b">82.4%</text>
    <text x="840" y="180" font-size="15" fill="#52525b">refuse both bots</text>
  </g>
</svg>
