<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="210" viewBox="0 0 1200 210">
  <title>Machine readiness by Tranco rank tier</title>
  <rect width="1200" height="210" fill="#ffffff"/>
  <g font-family="Inter, Arial, sans-serif">
    <text x="48" y="38" font-size="14" font-weight="600" fill="#71717a">MEAN SCORE · BOTH-BOT REFUSAL</text>
    <line x1="48" y1="58" x2="1152" y2="58" stroke="#e3e3e0"/>
    <text x="48" y="96" font-size="14" font-weight="600" fill="#71717a">RANKS 1 TO 10K</text>
    <text x="48" y="148" font-size="46" font-weight="700" fill="#18181b">26.1</text>
