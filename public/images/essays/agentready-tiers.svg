    <line x1="800" y1="78" x2="800" y2="188" stroke="#e3e3e0"/>
    <text x="840" y="96" font-size="14" font-weight="600" fill="#71717a">RANKS 100K TO 1M</text>
    <text x="840" y="148" font-size="46" font-weight="700" fill="#18181b">25.9</text>
