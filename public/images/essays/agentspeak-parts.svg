<svg xmlns="http://www.w3.org/2000/svg" width="400" height="440" viewBox="0 0 400 440" role="img" aria-labelledby="title description">
  <title id="title">Ways agents exchange information</title>
  <desc id="description">Natural-language messages, structured fields and function arguments, and learned numerical representations serve different purposes. Protocols can carry more than one form.</desc>
  <rect width="400" height="440" fill="#ffffff"/>
  <g font-family="Inter, Arial, sans-serif" fill="#37352f">
    <text x="20" y="28" font-size="17" font-weight="700">Ways agents exchange information</text>
    <text x="20" y="51" font-size="12" fill="#64748b">The content can change while the protocol stays.</text>
    <rect x="16" y="68" width="368" height="92" rx="5" fill="#f8fafc" stroke="#e3e3e0"/>
    <text x="30" y="94" font-size="16" font-weight="700" fill="#4f46e5">Natural language</text>
    <text x="30" y="118" font-size="13">Requests, explanations, and open questions</text>
    <text x="30" y="140" font-size="13">A model or person interprets the wording.</text>
    <rect x="16" y="176" width="368" height="92" rx="5" fill="#f8fafc" stroke="#e3e3e0"/>
    <text x="30" y="202" font-size="16" font-weight="700" fill="#4f46e5">Structured messages</text>
    <text x="30" y="226" font-size="13">Named fields, identifiers, and tool arguments</text>
    <text x="30" y="248" font-size="13">Software follows agreed types and meanings.</text>
    <rect x="16" y="284" width="368" height="92" rx="5" fill="#f8fafc" stroke="#e3e3e0"/>
    <text x="30" y="310" font-size="16" font-weight="700" fill="#4f46e5">Learned representations</text>
    <text x="30" y="334" font-size="13">Embeddings or model states</text>
    <text x="30" y="356" font-size="13">Receivers need compatible models or adapters.</text>
    <text x="20" y="404" font-size="12" fill="#64748b">An exchange can combine these forms.</text>
    <text x="20" y="426" font-size="12" fill="#64748b">veda.ng/agentspeak</text>
  </g>
</svg>
