<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 548" width="400" height="548" preserveAspectRatio="xMidYMid meet">
  <style>
    text { font-family: Inter, system-ui, sans-serif; }
    .title { font-size: 16px; font-weight: 600; fill: #18181b; }
    .name { font-size: 15px; font-weight: 600; fill: #18181b; }
    .row { font-size: 13px; fill: #18181b; }
    .dim { font-size: 13px; fill: #52525b; }
    .note { font-size: 12px; fill: #52525b; }
  </style>

  <text x="16" y="28" class="title">What an agent actually sends</text>

  <rect x="16" y="44" width="368" height="88" fill="#f4f4f5"/>
  <text x="28" y="70" class="name">TextPart</text>
  <text x="28" y="90" class="row">English. "Book the cheapest flight."</text>
  <text x="28" y="110" class="dim">Ambiguous. Auditable by a person.</text>

  <rect x="16" y="132" width="368" height="88" fill="#ffffff"/>
  <text x="28" y="158" class="name">DataPart</text>
  <text x="28" y="178" class="row">JSON. origin, date, cabin, max_usd</text>
  <text x="28" y="198" class="dim">Precise. A person can still read it.</text>

  <rect x="16" y="220" width="368" height="88" fill="#f4f4f5"/>
  <text x="28" y="246" class="name">Tool call</text>
  <text x="28" y="266" class="row">Function name + typed arguments</text>
  <text x="28" y="286" class="dim">The real speech of 2024-2026 agents.</text>

  <rect x="16" y="308" width="368" height="88" fill="#ffffff"/>
  <text x="28" y="334" class="name">Embedding / weight update</text>
  <text x="28" y="354" class="row">A vector. No words.</text>
  <text x="28" y="374" class="dim">Not in A2A. This is the next step.</text>

  <rect x="16" y="396" width="368" height="72" fill="#f4f4f5"/>
  <text x="28" y="418" class="name">Human log</text>
  <text x="28" y="438" class="row">Whatever the vendor chooses to store</text>
  <text x="28" y="458" class="dim">Often the TextPart. Rarely the vector.</text>

  <text x="16" y="500" class="note">A2A still ships TextPart in the sample.</text>
  <text x="16" y="520" class="note">The envelope is ready. The letter is English.</text>
  <text x="16" y="540" class="note">veda.ng/agentspeak</text>
</svg>
