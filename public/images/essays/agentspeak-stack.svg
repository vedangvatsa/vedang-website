<svg xmlns="http://www.w3.org/2000/svg" width="400" height="540" viewBox="0 0 400 540" role="img" aria-labelledby="title description">
  <title id="title">Different specifications, different jobs</title>
  <desc id="description">MCP describes tools and results. A2A describes messages and tasks. JSON Schema checks data shape. AP2 specifies signed payment authority records. x402 specifies payment requirements and verification for HTTP resources.</desc>
  <rect width="400" height="540" fill="#ffffff"/>
  <g font-family="Inter, Arial, sans-serif" fill="#37352f">
    <text x="20" y="29" font-size="17" font-weight="700">Different specifications, different jobs</text>
    <rect x="16" y="47" width="368" height="84" rx="5" fill="#f8fafc" stroke="#e3e3e0"/>
    <text x="30" y="72" font-size="16" font-weight="700" fill="#4f46e5">MCP</text>
    <text x="30" y="95" font-size="13">Tools, calls, and tool results</text>
    <text x="30" y="115" font-size="13">Results can contain text and structured data.</text>
    <rect x="16" y="141" width="368" height="84" rx="5" fill="#f8fafc" stroke="#e3e3e0"/>
    <text x="30" y="166" font-size="16" font-weight="700" fill="#4f46e5">A2A</text>
    <text x="30" y="189" font-size="13">Messages, task status, and artifacts</text>
    <text x="30" y="209" font-size="13">A way to exchange work across systems</text>
    <rect x="16" y="235" width="368" height="84" rx="5" fill="#f8fafc" stroke="#e3e3e0"/>
    <text x="30" y="260" font-size="16" font-weight="700" fill="#4f46e5">JSON Schema</text>
    <text x="30" y="283" font-size="13">Required fields and allowed value types</text>
    <text x="30" y="303" font-size="13">Checks data shape, not the truth of its claims.</text>
    <rect x="16" y="329" width="368" height="84" rx="5" fill="#f8fafc" stroke="#e3e3e0"/>
    <text x="30" y="354" font-size="16" font-weight="700" fill="#4f46e5">AP2</text>
    <text x="30" y="377" font-size="13">Signed checkout and payment mandates</text>
    <text x="30" y="397" font-size="13">Defines records and checks for authority.</text>
    <rect x="16" y="423" width="368" height="84" rx="5" fill="#f8fafc" stroke="#e3e3e0"/>
    <text x="30" y="448" font-size="16" font-weight="700" fill="#4f46e5">x402</text>
    <text x="30" y="471" font-size="13">HTTP 402 and payment requirements</text>
    <text x="30" y="491" font-size="13">Payment verification for a requested resource</text>
    <text x="20" y="530" font-size="12" fill="#64748b">Protocol roles | veda.ng/agentspeak</text>
  </g>
</svg>
