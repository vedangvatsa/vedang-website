<svg xmlns="http://www.w3.org/2000/svg" width="400" height="610" viewBox="0 0 400 610" role="img" aria-labelledby="title description">
  <title id="title">The roles of agent protocols</title>
  <desc id="description">MCP connects applications to tools. A2A supports remote agent tasks. ACP is an earlier project now part of A2A. AGNTCY supplies discovery, identity, and messaging components. AP2 and x402 handle different payment-related exchanges.</desc>
  <rect width="400" height="610" fill="#ffffff"/>
  <g font-family="Inter, Arial, sans-serif" fill="#37352f">
    <text x="20" y="29" font-size="18" font-weight="700">The roles of agent protocols</text>
    <text x="20" y="51" font-size="12" fill="#64748b">Exchanges, discovery, and specialized messages</text>
    <rect x="16" y="66" width="368" height="77" rx="5" fill="#f8fafc" stroke="#e3e3e0"/>
    <text x="30" y="89" font-size="16" font-weight="700" fill="#4f46e5">MCP</text>
    <text x="30" y="111" font-size="13">Tool and resource access</text>
    <text x="30" y="131" font-size="13">Structured calls and flexible results</text>
    <rect x="16" y="152" width="368" height="77" rx="5" fill="#f8fafc" stroke="#e3e3e0"/>
    <text x="30" y="175" font-size="16" font-weight="700" fill="#4f46e5">A2A</text>
    <text x="30" y="197" font-size="13">Communication with remote agent systems</text>
    <text x="30" y="217" font-size="13">Messages, tasks, and artifacts</text>
    <rect x="16" y="238" width="368" height="77" rx="5" fill="#f8fafc" stroke="#e3e3e0"/>
    <text x="30" y="261" font-size="16" font-weight="700" fill="#4f46e5">ACP (BeeAI)</text>
    <text x="30" y="283" font-size="13">Earlier REST-based agent protocol</text>
    <text x="30" y="303" font-size="13">Archived project now part of A2A</text>
    <rect x="16" y="324" width="368" height="77" rx="5" fill="#f8fafc" stroke="#e3e3e0"/>
    <text x="30" y="347" font-size="16" font-weight="700" fill="#4f46e5">AGNTCY</text>
    <text x="30" y="369" font-size="13">Discovery, identity, and messaging components</text>
    <text x="30" y="389" font-size="13">Includes OASF and SLIM</text>
    <rect x="16" y="410" width="368" height="77" rx="5" fill="#f8fafc" stroke="#e3e3e0"/>
    <text x="30" y="433" font-size="16" font-weight="700" fill="#4f46e5">AP2</text>
    <text x="30" y="455" font-size="13">Checkout and payment mandates</text>
    <text x="30" y="475" font-size="13">Records and verification of authority</text>
    <rect x="16" y="496" width="368" height="77" rx="5" fill="#f8fafc" stroke="#e3e3e0"/>
    <text x="30" y="519" font-size="16" font-weight="700" fill="#4f46e5">x402</text>
    <text x="30" y="541" font-size="13">Payment requirements over HTTP</text>
    <text x="30" y="561" font-size="13">Uses HTTP 402 for paid resources</text>
    <text x="20" y="598" font-size="12" fill="#64748b">veda.ng/agentspeak</text>
  </g>
</svg>
