<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <!-- Background -->
  <rect width="800" height="400" fill="#ffffff" />

  <!-- Subtle grid lines for depth -->
  <line x1="0" y1="80" x2="800" y2="80" stroke="#f0f0ee" stroke-width="0.5" />
  <line x1="0" y1="160" x2="800" y2="160" stroke="#f0f0ee" stroke-width="0.5" />
  <line x1="0" y1="240" x2="800" y2="240" stroke="#f0f0ee" stroke-width="0.5" />
  <line x1="0" y1="320" x2="800" y2="320" stroke="#f0f0ee" stroke-width="0.5" />

  <!-- ============ LEFT PANEL: Market Data Card ============ -->
  <rect x="30" y="28" width="350" height="344" rx="6" fill="#ffffff" stroke="#e3e3e0" stroke-width="1.5" />

  <!-- Card header bar -->
  <rect x="30" y="28" width="350" height="6" rx="3" fill="#3b82f6" />

  <!-- Section label -->
  <text x="50" y="62" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="600" fill="#3b82f6" letter-spacing="1.5">AI AGENT MARKET</text>

  <!-- Big number: 2025 -->
  <text x="50" y="104" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="42" font-weight="800" fill="#37352f">$7.5B</text>
  <text x="230" y="104" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="400" fill="#787774">2025 market size</text>

  <!-- Arrow -->
  <line x1="50" y1="120" x2="320" y2="120" stroke="#e3e3e0" stroke-width="1" />
  <polygon points="50,126 200,126 200,132 50,132" fill="#3b82f6" opacity="0.08" />

  <!-- Growth arrow icon -->
  <polygon points="180,138 200,128 220,138" fill="#3b82f6" opacity="0.3" />

  <!-- Big number: 2030 -->
  <text x="50" y="175" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="42" font-weight="800" fill="#3b82f6">$50B+</text>
  <text x="248" y="175" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="400" fill="#787774">projected by 2030</text>

  <!-- CAGR badge -->
  <rect x="50" y="194" width="112" height="28" rx="14" fill="#3b82f6" opacity="0.08" />
  <text x="106" y="213" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" fill="#3b82f6" text-anchor="middle">33-46% CAGR</text>

  <!-- Divider -->
  <line x1="50" y1="240" x2="360" y2="240" stroke="#e3e3e0" stroke-width="1" />

  <!-- Enterprise adoption stat -->
  <text x="50" y="268" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="600" fill="#787774" letter-spacing="1">ENTERPRISE ADOPTION</text>

  <!-- Progress bar background -->
  <rect x="50" y="278" width="310" height="14" rx="7" fill="#f0f0ee" />
  <!-- Progress bar fill (79%) -->
  <rect x="50" y="278" width="245" height="14" rx="7" fill="#3b82f6" opacity="0.75" />
  <!-- Percentage label -->
  <text x="302" y="290" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="800" fill="#37352f">79%</text>

  <text x="50" y="312" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#787774">of enterprises deploying or piloting AI agents</text>

  <!-- Coase reference -->
  <rect x="50" y="326" width="310" height="34" rx="4" fill="#f7f7f5" />
  <text x="60" y="342" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="600" fill="#37352f">Coase's Theory (1937):</text>
  <text x="60" y="354" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="400" fill="#787774">Transaction costs collapsing, firms restructuring</text>

  <!-- ============ VERTICAL DIVIDER ============ -->
  <line x1="410" y1="50" x2="410" y2="350" stroke="#e3e3e0" stroke-width="1" stroke-dasharray="4,4" />

  <!-- ============ RIGHT PANEL: Impact Data ============ -->

  <!-- Section label -->
  <text x="435" y="56" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="600" fill="#3b82f6" letter-spacing="1.5">ECONOMIC IMPACT</text>

  <!-- Comparison: Traditional vs Agent-Augmented -->
  <text x="435" y="82" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" fill="#37352f">Workforce Cost Structure</text>

  <!-- Bar 1: Traditional Corp -->
  <text x="435" y="104" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="400" fill="#787774">Traditional Corporation</text>
  <rect x="435" y="110" width="320" height="20" rx="3" fill="#e3e3e0" opacity="0.6" />
  <rect x="435" y="110" width="320" height="20" rx="3" fill="#37352f" opacity="0.12" />
  <text x="745" y="124" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="600" fill="#37352f" text-anchor="end">100%</text>

  <!-- Bar 2: Agent-Augmented -->
  <text x="435" y="152" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="400" fill="#787774">Agent-Augmented Org</text>
  <rect x="435" y="158" width="320" height="20" rx="3" fill="#e3e3e0" opacity="0.6" />
  <rect x="435" y="158" width="170" height="20" rx="3" fill="#3b82f6" opacity="0.65" />
  <text x="612" y="172" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="700" fill="#3b82f6">~53%</text>

  <!-- Savings annotation -->
  <line x1="605" y1="182" x2="605" y2="196" stroke="#3b82f6" stroke-width="1" stroke-dasharray="2,2" />
  <text x="605" y="207" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="400" fill="#3b82f6" text-anchor="middle">~47% cost reduction</text>

  <!-- Divider -->
  <line x1="435" y1="222" x2="765" y2="222" stroke="#e3e3e0" stroke-width="1" />

  <!-- Case Study: Klarna -->
  <text x="435" y="245" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="600" fill="#787774" letter-spacing="1">CASE STUDY: KLARNA</text>

  <!-- Klarna stats row -->
  <!-- Stat 1: FTEs -->
  <rect x="435" y="256" width="155" height="68" rx="4" fill="#f7f7f5" />
  <text x="512" y="284" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="28" font-weight="800" fill="#37352f" text-anchor="middle">700</text>
  <text x="512" y="302" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="400" fill="#787774" text-anchor="middle">FTE equivalent replaced</text>
  <text x="512" y="316" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="400" fill="#787774" text-anchor="middle">by AI agents</text>

  <!-- Stat 2: Savings -->
  <rect x="600" y="256" width="155" height="68" rx="4" fill="#f7f7f5" />
  <text x="677" y="284" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="28" font-weight="800" fill="#3b82f6" text-anchor="middle">$40M</text>
  <text x="677" y="302" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="400" fill="#787774" text-anchor="middle">annual savings from</text>
  <text x="677" y="316" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="400" fill="#787774" text-anchor="middle">agent deployment</text>

  <!-- Growth trajectory mini-chart -->
  <text x="435" y="348" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="600" fill="#787774" letter-spacing="1">MARKET TRAJECTORY</text>

  <!-- Mini bar chart: 2024-2030 -->
  <rect x="435" y="362" width="20" height="14" rx="2" fill="#37352f" opacity="0.15" />
  <text x="445" y="390" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="8" fill="#787774" text-anchor="middle">'24</text>

  <rect x="465" y="356" width="20" height="20" rx="2" fill="#37352f" opacity="0.2" />
  <text x="475" y="390" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="8" fill="#787774" text-anchor="middle">'25</text>

  <rect x="495" y="348" width="20" height="28" rx="2" fill="#3b82f6" opacity="0.3" />
  <text x="505" y="390" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="8" fill="#787774" text-anchor="middle">'26</text>

  <rect x="525" y="338" width="20" height="38" rx="2" fill="#3b82f6" opacity="0.4" />
  <text x="535" y="390" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="8" fill="#787774" text-anchor="middle">'27</text>

  <rect x="555" y="324" width="20" height="52" rx="2" fill="#3b82f6" opacity="0.5" />
  <text x="565" y="390" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="8" fill="#787774" text-anchor="middle">'28</text>

  <rect x="585" y="308" width="20" height="68" rx="2" fill="#3b82f6" opacity="0.6" />
  <text x="595" y="390" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="8" fill="#787774" text-anchor="middle">'29</text>

  <rect x="615" y="288" width="20" height="88" rx="2" fill="#3b82f6" opacity="0.75" />
  <text x="625" y="390" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="8" fill="#787774" text-anchor="middle">'30</text>

  <!-- $50B+ label on last bar -->
  <text x="625" y="283" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="9" font-weight="700" fill="#3b82f6" text-anchor="middle">$50B+</text>

  <!-- ============ ATTRIBUTION ============ -->
  <text x="768" y="394" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#787774" text-anchor="end">@vedangvatsa</text>
</svg>