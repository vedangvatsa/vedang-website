<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380">
  <title>Claude.ai use by Indian state</title>
  <rect width="1200" height="380" fill="#ffffff"/>
  <text x="48" y="48" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#18181b">Claude.ai use by state</text>
  <text x="48" y="78" font-family="Inter, Arial, sans-serif" font-size="16" fill="#71717a">Share of India conversations, November 2025</text>

  <g font-family="Inter, Arial, sans-serif">
    <text x="48" y="130" font-size="17" fill="#18181b">Maharashtra</text>
    <rect x="220" y="112" width="780" height="24" fill="#f4f4f5"/>
    <rect x="220" y="112" width="465" height="24" fill="#18181b"/>
    <text x="1128" y="131" font-size="18" font-weight="700" fill="#18181b" text-anchor="end">15.5%</text>

    <text x="48" y="182" font-size="17" fill="#18181b">Tamil Nadu</text>
    <rect x="220" y="164" width="780" height="24" fill="#f4f4f5"/>
    <rect x="220" y="164" width="396" height="24" fill="#18181b"/>
    <text x="1128" y="183" font-size="18" font-weight="700" fill="#18181b" text-anchor="end">13.2%</text>

    <text x="48" y="234" font-size="17" fill="#18181b">Karnataka</text>
    <rect x="220" y="216" width="780" height="24" fill="#f4f4f5"/>
    <rect x="220" y="216" width="381" height="24" fill="#18181b"/>
    <text x="1128" y="235" font-size="18" font-weight="700" fill="#18181b" text-anchor="end">12.7%</text>

    <text x="48" y="286" font-size="17" fill="#18181b">Delhi</text>
    <rect x="220" y="268" width="780" height="24" fill="#f4f4f5"/>
    <rect x="220" y="268" width="315" height="24" fill="#18181b"/>
    <text x="1128" y="287" font-size="18" font-weight="700" fill="#18181b" text-anchor="end">10.5%</text>

    <text x="48" y="340" font-size="14" fill="#71717a">Four states account for more than half of India use in the sample. Source: Anthropic</text>
  </g>
</svg>
