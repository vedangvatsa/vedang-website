<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">
  <title>Claude.ai use concentrated in four Indian states</title>
  <rect width="1200" height="420" fill="#ffffff"/>

  <text x="48" y="48" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#18181b">Claude.ai use by Indian state</text>
  <text x="48" y="78" font-family="Inter, Arial, sans-serif" font-size="16" fill="#71717a">Share of India conversations, November 2025 sample</text>

  <g font-family="Inter, Arial, sans-serif">
    <text x="48" y="132" font-size="17" font-weight="650" fill="#18181b">Maharashtra</text>
    <rect x="220" y="112" width="760" height="28" rx="4" fill="#eef2ff"/>
    <rect x="220" y="112" width="465" height="28" rx="4" fill="#4f46e5"/>
    <text x="1120" y="133" font-size="20" font-weight="700" fill="#4f46e5" text-anchor="end">15.5%</text>

    <text x="48" y="188" font-size="17" font-weight="650" fill="#18181b">Tamil Nadu</text>
    <rect x="220" y="168" width="760" height="28" rx="4" fill="#eef2ff"/>
    <rect x="220" y="168" width="396" height="28" rx="4" fill="#4f46e5"/>
    <text x="1120" y="189" font-size="20" font-weight="700" fill="#4f46e5" text-anchor="end">13.2%</text>

    <text x="48" y="244" font-size="17" font-weight="650" fill="#18181b">Karnataka</text>
    <rect x="220" y="224" width="760" height="28" rx="4" fill="#eef2ff"/>
    <rect x="220" y="224" width="381" height="28" rx="4" fill="#4f46e5"/>
    <text x="1120" y="245" font-size="20" font-weight="700" fill="#4f46e5" text-anchor="end">12.7%</text>

    <text x="48" y="300" font-size="17" font-weight="650" fill="#18181b">Delhi</text>
    <rect x="220" y="280" width="760" height="28" rx="4" fill="#eef2ff"/>
    <rect x="220" y="280" width="315" height="28" rx="4" fill="#4f46e5"/>
    <text x="1120" y="301" font-size="20" font-weight="700" fill="#4f46e5" text-anchor="end">10.5%</text>

    <text x="48" y="356" font-size="15" fill="#52525b">These four states account for more than half of India Claude.ai use in the sample.</text>
    <text x="48" y="382" font-size="13" fill="#a1a1aa">Source: Anthropic India Country Brief, Economic Index, November 2025 sample</text>
  </g>
</svg>
