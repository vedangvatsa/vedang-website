<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400">
  <title>Three layers of AI use in India</title>
  <rect width="1200" height="400" fill="#ffffff"/>

  <text x="48" y="48" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#18181b">How India uses AI, in three layers</text>
  <text x="48" y="78" font-family="Inter, Arial, sans-serif" font-size="16" fill="#71717a">Chatbots, silent systems, and the labour that trains models</text>

  <rect x="48" y="110" width="350" height="230" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="72" y="148" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#4f46e5">LAYER 1</text>
  <text x="72" y="182" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#18181b">Open the app</text>
  <text x="72" y="214" font-family="Inter, Arial, sans-serif" font-size="15" fill="#52525b">WhatsApp Meta AI, Gemini,</text>
  <text x="72" y="236" font-family="Inter, Arial, sans-serif" font-size="15" fill="#52525b">Claude, Perplexity</text>
  <text x="72" y="274" font-family="Inter, Arial, sans-serif" font-size="14" fill="#71717a">High absolute use.</text>
  <text x="72" y="296" font-family="Inter, Arial, sans-serif" font-size="14" fill="#71717a">Uneven per-person use.</text>

  <rect x="425" y="110" width="350" height="230" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="449" y="148" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f766e">LAYER 2</text>
  <text x="449" y="182" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#18181b">Silent systems</text>
  <text x="449" y="214" font-family="Inter, Arial, sans-serif" font-size="15" fill="#52525b">Health claims, spam filters,</text>
  <text x="449" y="236" font-family="Inter, Arial, sans-serif" font-size="15" fill="#52525b">weather, DigiYatra, courts</text>
  <text x="449" y="274" font-family="Inter, Arial, sans-serif" font-size="14" fill="#71717a">Often no chatbot screen.</text>
  <text x="449" y="296" font-family="Inter, Arial, sans-serif" font-size="14" fill="#71717a">Scale shows in programme totals.</text>

  <rect x="802" y="110" width="350" height="230" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="826" y="148" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#b45309">LAYER 3</text>
  <text x="826" y="182" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#18181b">Train the model</text>
  <text x="826" y="214" font-family="Inter, Arial, sans-serif" font-size="15" fill="#52525b">Annotation, RLHF, motion</text>
  <text x="826" y="236" font-family="Inter, Arial, sans-serif" font-size="15" fill="#52525b">capture for robotics data</text>
  <text x="826" y="274" font-family="Inter, Arial, sans-serif" font-size="14" fill="#71717a">Pays workers, often outside</text>
  <text x="826" y="296" font-family="Inter, Arial, sans-serif" font-size="14" fill="#71717a">the big IT cities.</text>
</svg>
