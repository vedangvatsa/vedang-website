<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <title>Three layers of AI use in India</title>
  <rect width="1200" height="320" fill="#ffffff"/>
  <text x="48" y="48" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#71717a" letter-spacing="0.06em">INDIA</text>
  <text x="48" y="92" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700" fill="#18181b">How India uses AI</text>
  <text x="48" y="128" font-family="Inter, Arial, sans-serif" font-size="18" fill="#52525b">Three measures that get mixed in one headline</text>
  <line x1="48" y1="156" x2="1152" y2="156" stroke="#e3e3e0"/>

  <g font-family="Inter, Arial, sans-serif">
    <text x="48" y="198" font-size="14" font-weight="600" fill="#71717a">1 · CHAT</text>
    <text x="48" y="236" font-size="26" font-weight="700" fill="#18181b">Open the app</text>
    <text x="48" y="270" font-size="16" fill="#52525b">Meta AI, Gemini, Claude</text>

    <line x1="400" y1="180" x2="400" y2="290" stroke="#e3e3e0"/>
    <text x="440" y="198" font-size="14" font-weight="600" fill="#71717a">2 · SYSTEMS</text>
    <text x="440" y="236" font-size="26" font-weight="700" fill="#18181b">Silent workflows</text>
    <text x="440" y="270" font-size="16" fill="#52525b">Health, courts, weather, spam</text>

    <line x1="800" y1="180" x2="800" y2="290" stroke="#e3e3e0"/>
    <text x="840" y="198" font-size="14" font-weight="600" fill="#71717a">3 · LABOUR</text>
    <text x="840" y="236" font-size="26" font-weight="700" fill="#18181b">Train the model</text>
    <text x="840" y="270" font-size="16" fill="#52525b">Annotation and motion data</text>
  </g>
</svg>
