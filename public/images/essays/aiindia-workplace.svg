<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <title>Workplace AI survey figures for India</title>
  <rect width="1200" height="300" fill="#ffffff"/>
  <text x="48" y="48" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#18181b">Workplace surveys, side by side</text>
  <text x="48" y="78" font-family="Inter, Arial, sans-serif" font-size="16" fill="#71717a">Different samples, different years</text>
  <line x1="48" y1="104" x2="1152" y2="104" stroke="#e3e3e0"/>

  <g font-family="Inter, Arial, sans-serif">
    <text x="48" y="148" font-size="14" font-weight="600" fill="#71717a">MSFT / LINKEDIN 2024</text>
    <text x="48" y="204" font-size="48" font-weight="700" fill="#18181b">92%</text>
    <text x="48" y="242" font-size="16" fill="#52525b">knowledge workers use AI</text>

    <line x1="400" y1="130" x2="400" y2="260" stroke="#e3e3e0"/>
    <text x="440" y="148" font-size="14" font-weight="600" fill="#71717a">BCG 2026</text>
    <text x="440" y="204" font-size="48" font-weight="700" fill="#18181b">70%</text>
    <text x="440" y="242" font-size="16" fill="#52525b">frontline users save a day</text>

    <line x1="800" y1="130" x2="800" y2="260" stroke="#e3e3e0"/>
    <text x="840" y="148" font-size="14" font-weight="600" fill="#71717a">SALESFORCE 2026</text>
    <text x="840" y="204" font-size="48" font-weight="700" fill="#18181b">38%</text>
    <text x="840" y="242" font-size="16" fill="#52525b">org had a failed AI pilot</text>
  </g>
</svg>
