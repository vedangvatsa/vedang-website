<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <!-- Background -->
  <rect width="800" height="400" fill="#ffffff" />

  <!-- Top label -->
  <text x="400" y="38" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="600" font-size="11" fill="#787774" text-anchor="middle" letter-spacing="0.12em">THE EVOLUTION OF HUMAN-COMPUTER INTERACTION</text>

  <!-- Timeline horizontal line -->
  <line x1="80" y1="110" x2="720" y2="110" stroke="#e3e3e0" stroke-width="2" />

  <!-- CLI node -->
  <circle cx="120" cy="110" r="8" fill="#787774" />
  <circle cx="120" cy="110" r="4" fill="#ffffff" />
  <text x="120" y="90" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="700" font-size="13" fill="#37352f" text-anchor="middle">CLI</text>
  <text x="120" y="138" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="400" font-size="10" fill="#787774" text-anchor="middle">1970s</text>
  <text x="120" y="152" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="400" font-size="10" fill="#787774" text-anchor="middle">Command Line</text>

  <!-- Arrow 1 -->
  <polygon points="215,106 210,110 215,114" fill="#e3e3e0" />

  <!-- GUI node -->
  <circle cx="270" cy="110" r="8" fill="#787774" />
  <circle cx="270" cy="110" r="4" fill="#ffffff" />
  <text x="270" y="90" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="700" font-size="13" fill="#37352f" text-anchor="middle">GUI</text>
  <text x="270" y="138" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="400" font-size="10" fill="#787774" text-anchor="middle">1984</text>
  <text x="270" y="152" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="400" font-size="10" fill="#787774" text-anchor="middle">Macintosh</text>

  <!-- Arrow 2 -->
  <polygon points="365,106 360,110 365,114" fill="#e3e3e0" />

  <!-- Touch node -->
  <circle cx="420" cy="110" r="8" fill="#3b82f6" />
  <circle cx="420" cy="110" r="4" fill="#ffffff" />
  <text x="420" y="90" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="700" font-size="13" fill="#37352f" text-anchor="middle">Touch</text>
  <text x="420" y="138" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="400" font-size="10" fill="#787774" text-anchor="middle">2007</text>
  <text x="420" y="152" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="400" font-size="10" fill="#787774" text-anchor="middle">iPhone</text>

  <!-- Arrow 3 -->
  <polygon points="515,106 510,110 515,114" fill="#e3e3e0" />

  <!-- Voice node -->
  <circle cx="570" cy="110" r="8" fill="#3b82f6" />
  <circle cx="570" cy="110" r="4" fill="#ffffff" />
  <text x="570" y="90" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="700" font-size="13" fill="#37352f" text-anchor="middle">Voice</text>
  <text x="570" y="138" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="400" font-size="10" fill="#787774" text-anchor="middle">2014</text>
  <text x="570" y="152" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="400" font-size="10" fill="#787774" text-anchor="middle">Echo</text>

  <!-- Arrow 4 -->
  <polygon points="635,106 630,110 635,114" fill="#e3e3e0" />

  <!-- Ambient node (highlighted) -->
  <circle cx="690" cy="110" r="12" fill="#10b981" opacity="0.15" />
  <circle cx="690" cy="110" r="8" fill="#10b981" />
  <circle cx="690" cy="110" r="4" fill="#ffffff" />
  <text x="690" y="86" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="700" font-size="13" fill="#10b981" text-anchor="middle">Ambient</text>
  <text x="690" y="138" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="400" font-size="10" fill="#10b981" text-anchor="middle">2025+</text>
  <text x="690" y="152" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="400" font-size="10" fill="#10b981" text-anchor="middle">Everywhere</text>

  <!-- Divider line -->
  <line x1="80" y1="185" x2="720" y2="185" stroke="#e3e3e0" stroke-width="1" stroke-dasharray="4 3" />

  <!-- Stat Box 1: Market Size -->
  <rect x="80" y="210" width="195" height="130" rx="6" fill="#ffffff" stroke="#e3e3e0" stroke-width="1.5" />
  <rect x="80" y="210" width="195" height="4" rx="2" fill="#10b981" />
  <text x="177" y="252" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="32" fill="#10b981" text-anchor="middle">$175B</text>
  <text x="177" y="275" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="600" font-size="12" fill="#37352f" text-anchor="middle">Smart Home Market</text>
  <text x="177" y="293" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="400" font-size="10" fill="#787774" text-anchor="middle">Projected 2025 value</text>
  <text x="177" y="330" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="400" font-size="9" fill="#787774" text-anchor="middle" opacity="0.6">Source: Statista</text>

  <!-- Stat Box 2: Device Shipments -->
  <rect x="303" y="210" width="195" height="130" rx="6" fill="#ffffff" stroke="#e3e3e0" stroke-width="1.5" />
  <rect x="303" y="210" width="195" height="4" rx="2" fill="#3b82f6" />
  <text x="400" y="252" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="32" fill="#3b82f6" text-anchor="middle">1.25B</text>
  <text x="400" y="275" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="600" font-size="12" fill="#37352f" text-anchor="middle">Annual Device Shipments</text>
  <text x="400" y="293" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="400" font-size="10" fill="#787774" text-anchor="middle">Smart devices shipped per year</text>
  <text x="400" y="330" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="400" font-size="9" fill="#787774" text-anchor="middle" opacity="0.6">Source: IDC</text>

  <!-- Stat Box 3: Matter Protocol -->
  <rect x="526" y="210" width="195" height="130" rx="6" fill="#ffffff" stroke="#e3e3e0" stroke-width="1.5" />
  <rect x="526" y="210" width="195" height="4" rx="2" fill="#10b981" />
  <text x="623" y="252" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="32" fill="#10b981" text-anchor="middle">550+</text>
  <text x="623" y="275" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="600" font-size="12" fill="#37352f" text-anchor="middle">Matter Companies</text>
  <text x="623" y="293" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="400" font-size="10" fill="#787774" text-anchor="middle">Unified protocol consortium</text>
  <text x="623" y="330" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="400" font-size="9" fill="#787774" text-anchor="middle" opacity="0.6">Source: CSA</text>

  <!-- Bottom divider -->
  <line x1="80" y1="360" x2="720" y2="360" stroke="#e3e3e0" stroke-width="1" />

  <!-- Bottom label -->
  <text x="400" y="383" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="600" font-size="12" fill="#37352f" text-anchor="middle" letter-spacing="0.05em">The Physical World Becomes a Computing Surface</text>

  <!-- Attribution -->
  <text x="755" y="393" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="400" font-size="11" fill="#787774" text-anchor="end">@vedangvatsa</text>
</svg>