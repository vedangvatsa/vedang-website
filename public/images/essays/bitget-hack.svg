<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" role="img" aria-labelledby="title desc">
  <title id="title">Bitget security notice, September 24, 2026</title>
  <desc id="desc">According to CEO Gracy Chen: part of the hot and warm wallet layers was affected, withdrawals are paused, and the attack method remains under investigation.</desc>
  <rect width="800" height="400" fill="#fafaf8"/>
  <g font-family="Inter, Arial, sans-serif" fill="#37352f">
    <text x="40" y="49" font-size="13" letter-spacing="1.2" fill="#676761">SEPTEMBER 24, 2026 · COMPANY DISCLOSURE</text>
    <text x="40" y="100" font-size="30" font-weight="600">What the security notice tells us</text>
    <path d="M40 130H760" stroke="#d9d9d2"/>
    <text x="40" y="174" font-size="14" fill="#78786f">WALLET SCOPE</text>
    <text x="40" y="210" font-size="23" font-weight="600">Hot + warm</text>
    <text x="40" y="242" font-size="16">Part of these layers</text>
    <text x="40" y="266" font-size="16">affected, says Bitget.</text>
    <path d="M280 160V284M536 160V284" stroke="#d9d9d2"/>
    <text x="306" y="174" font-size="14" fill="#78786f">WITHDRAWALS</text>
    <text x="306" y="210" font-size="23" font-weight="600" fill="#a34a35">Paused</text>
    <text x="306" y="242" font-size="16">Pending review.</text>
    <text x="306" y="266" font-size="16">No restart time given.</text>
    <text x="562" y="174" font-size="14" fill="#78786f">ATTACK METHOD</text>
    <text x="562" y="210" font-size="23" font-weight="600">Undisclosed</text>
    <text x="562" y="242" font-size="16">Investigation ongoing.</text>
    <text x="562" y="266" font-size="16">Report promised.</text>
    <path d="M40 318H760" stroke="#d9d9d2"/>
    <text x="40" y="351" font-size="13" fill="#676761">Source: Gracy Chen's security notice on X. Company claims, not an independent audit.</text>
    <text x="40" y="375" font-size="12" fill="#676761">Vedang Vatsa · veda.ng</text>
  </g>
</svg>
