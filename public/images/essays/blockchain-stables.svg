  <text x="48" y="78" font-family="Inter, Arial, sans-serif" font-size="16" fill="#71717a">McKinsey / Artemis via CoinDesk</text>
  <line x1="48" y1="110" x2="1152" y2="110" stroke="#e3e3e0"/>

  <g font-family="Inter, Arial, sans-serif">
