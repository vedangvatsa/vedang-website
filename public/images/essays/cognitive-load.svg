<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <!-- Background -->
  <rect width="800" height="400" fill="#ffffff" />

  <!-- Title -->
  <text x="400" y="42" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="700" font-size="20" fill="#37352f" text-anchor="middle" letter-spacing="-0.3">The Measured Collapse of Attention</text>
  <text x="400" y="62" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="400" font-size="12" fill="#787774" text-anchor="middle">Average sustained attention on a single screen, 2004 vs 2024</text>

  <!-- Divider line under title -->
  <line x1="100" y1="76" x2="700" y2="76" stroke="#e3e3e0" stroke-width="1" />

  <!-- LEFT SECTION: Attention Decline Visualization -->
  <!-- 2004 bar -->
  <text x="120" y="108" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="600" font-size="13" fill="#37352f">2004</text>
  <rect x="170" y="94" width="300" height="22" rx="4" fill="#3b82f6" opacity="0.15" />
  <rect x="170" y="94" width="300" height="22" rx="4" fill="#3b82f6" opacity="0.25" />
  <text x="480" y="109" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="700" font-size="15" fill="#3b82f6">2.5 min</text>
  <text x="480" y="122" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="400" font-size="10" fill="#787774">(150 sec)</text>

  <!-- Decline arrow -->
  <line x1="210" y1="126" x2="210" y2="148" stroke="#e11d48" stroke-width="1.5" />
  <polygon points="204,146 210,156 216,146" fill="#e11d48" />
  <text x="230" y="146" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="600" font-size="11" fill="#e11d48">-69%</text>

  <!-- 2024 bar -->
  <text x="120" y="174" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="600" font-size="13" fill="#37352f">2024</text>
  <rect x="170" y="160" width="94" height="22" rx="4" fill="#e11d48" opacity="0.18" />
  <rect x="170" y="160" width="94" height="22" rx="4" fill="#e11d48" opacity="0.25" />
  <text x="274" y="175" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="700" font-size="15" fill="#e11d48">47 sec</text>

  <!-- Ghost outline showing lost attention -->
  <rect x="264" y="160" width="206" height="22" rx="4" fill="none" stroke="#e3e3e0" stroke-width="1" stroke-dasharray="4,3" />
  <text x="367" y="175" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="400" font-size="10" fill="#c4c4c0" text-anchor="middle">lost capacity</text>

  <!-- Section divider -->
  <line x1="100" y1="200" x2="700" y2="200" stroke="#e3e3e0" stroke-width="1" />

  <!-- STAT GRID: 2x3 layout -->
  <!-- Row 1 -->

  <!-- Stat 1: Phone checks -->
  <text x="180" y="234" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="700" font-size="28" fill="#e11d48" text-anchor="middle">200</text>
  <text x="180" y="252" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="500" font-size="11" fill="#37352f" text-anchor="middle">daily phone checks</text>
  <text x="180" y="266" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="400" font-size="9.5" fill="#787774" text-anchor="middle">once every 4.8 minutes awake</text>

  <!-- Stat 2: Recovery time -->
  <text x="400" y="234" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="700" font-size="28" fill="#e11d48" text-anchor="middle">23 min</text>
  <text x="400" y="252" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="500" font-size="11" fill="#37352f" text-anchor="middle">recovery per interruption</text>
  <text x="400" y="266" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="400" font-size="9.5" fill="#787774" text-anchor="middle">Gloria Mark, UC Irvine</text>

  <!-- Stat 3: Push notifications -->
  <text x="620" y="234" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="700" font-size="28" fill="#e11d48" text-anchor="middle">46</text>
  <text x="620" y="252" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="500" font-size="11" fill="#37352f" text-anchor="middle">push notifications / day</text>
  <text x="620" y="266" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="400" font-size="9.5" fill="#787774" text-anchor="middle">average US smartphone user</text>

  <!-- Row divider -->
  <line x1="130" y1="282" x2="670" y2="282" stroke="#e3e3e0" stroke-width="0.5" />

  <!-- Row 2 -->

  <!-- Stat 4: Screen time -->
  <text x="180" y="316" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="700" font-size="28" fill="#3b82f6" text-anchor="middle">6h 45m</text>
  <text x="180" y="334" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="500" font-size="11" fill="#37352f" text-anchor="middle">avg daily screen time</text>
  <text x="180" y="348" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="400" font-size="9.5" fill="#787774" text-anchor="middle">US adults, 2024</text>

  <!-- Stat 5: Productivity loss -->
  <text x="400" y="316" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="700" font-size="28" fill="#e11d48" text-anchor="middle">$450-650B</text>
  <text x="400" y="334" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="500" font-size="11" fill="#37352f" text-anchor="middle">annual US productivity loss</text>
  <text x="400" y="348" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="400" font-size="9.5" fill="#787774" text-anchor="middle">from digital distraction</text>

  <!-- Stat 6: Communication apps -->
  <text x="620" y="316" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="700" font-size="28" fill="#3b82f6" text-anchor="middle">57%</text>
  <text x="620" y="334" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="500" font-size="11" fill="#37352f" text-anchor="middle">of work time in comms apps</text>
  <text x="620" y="348" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="400" font-size="9.5" fill="#787774" text-anchor="middle">Slack, email, meetings</text>

  <!-- Vertical dividers in stat grid -->
  <line x1="290" y1="212" x2="290" y2="360" stroke="#e3e3e0" stroke-width="0.5" />
  <line x1="510" y1="212" x2="510" y2="360" stroke="#e3e3e0" stroke-width="0.5" />

  <!-- Bottom border -->
  <line x1="100" y1="370" x2="700" y2="370" stroke="#e3e3e0" stroke-width="1" />

  <!-- Attribution -->
  <text x="700" y="390" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="400" font-size="11" fill="#787774" text-anchor="end">@vedangvatsa</text>
</svg>