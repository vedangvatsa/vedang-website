<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="400" height="560" preserveAspectRatio="xMidYMid meet">
  <style>
    text { font-family: Inter, system-ui, sans-serif; }
    .title { font-size: 16px; font-weight: 600; fill: #18181b; }
    .name { font-size: 15px; font-weight: 600; fill: #18181b; }
    .model { font-size: 13px; fill: #52525b; }
    .metric { font-size: 14px; fill: #18181b; }
    .hours { font-size: 13px; font-weight: 600; fill: #52525b; }
    .note { font-size: 12px; fill: #52525b; }
  </style>

  <text x="16" y="28" class="title">6 models, 6 metrics, 0 hour ledgers</text>

  <rect x="16" y="44" width="368" height="72" fill="#f4f4f5"/>
  <text x="28" y="66" class="name">US NAIRR</text>
  <text x="372" y="66" class="hours" text-anchor="end">Hours: No</text>
  <text x="28" y="86" class="model">Donation + coordination</text>
  <text x="28" y="106" class="metric">840+ projects supported</text>

  <rect x="16" y="116" width="368" height="72" fill="#ffffff"/>
  <text x="28" y="138" class="name">UK AIRR</text>
  <text x="372" y="138" class="hours" text-anchor="end">Hours: No</text>
  <text x="28" y="158" class="model">Public procurement</text>
  <text x="28" y="178" class="metric">2 machines, chip counts</text>

  <rect x="16" y="188" width="368" height="72" fill="#f4f4f5"/>
  <text x="28" y="210" class="name">EU AI Factories</text>
  <text x="372" y="210" class="hours" text-anchor="end">Hours: No</text>
  <text x="28" y="230" class="model">Co-federation</text>
  <text x="28" y="250" class="metric">19 sites selected</text>

  <rect x="16" y="260" width="368" height="72" fill="#ffffff"/>
  <text x="28" y="282" class="name">IndiaAI</text>
  <text x="372" y="282" class="hours" text-anchor="end">Hours: No</text>
  <text x="28" y="302" class="model">Empanelment rental</text>
  <text x="28" y="322" class="metric">38,000 GPUs onboarded</text>

  <rect x="16" y="332" width="368" height="72" fill="#f4f4f5"/>
  <text x="28" y="354" class="name">France</text>
  <text x="372" y="354" class="hours" text-anchor="end">Hours: No</text>
  <text x="28" y="374" class="model">Private pledges + EU sites</text>
  <text x="28" y="394" class="metric">Summit investment counted</text>

  <rect x="16" y="404" width="368" height="72" fill="#ffffff"/>
  <text x="28" y="426" class="name">Japan</text>
  <text x="372" y="426" class="hours" text-anchor="end">Hours: No</text>
  <text x="28" y="446" class="model">METI subsidies + SoftBank</text>
  <text x="28" y="466" class="metric">Named subsidy max, not hours</text>

  <text x="16" y="508" class="note">Hours = GPU-hours used per unit of public money.</text>
  <text x="16" y="528" class="note">India published hours sanctioned, not hours used.</text>
  <text x="16" y="548" class="note">None of the 6 publishes hours consumed.</text>
</svg>
