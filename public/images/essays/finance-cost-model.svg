<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative monthly cost per accepted task</title>
  <desc id="desc">Bar chart of USD cost per accepted task at 5%, 20%, and 50% human review shares, assuming 10,000 submitted tasks and 95% acceptance. Stacked breakdown for the 20% review case.</desc>
  <rect x="1" y="1" width="798" height="398" rx="8" fill="#ffffff" stroke="#e3e3e0"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#37352f">
    <text x="32" y="48" font-size="28" font-weight="700">Cost per accepted task</text>
    <text x="32" y="78" font-size="16" fill="#52525b">Illustrative assumptions (10,000 submitted; 95% accepted; $0.20 automated; $3,000 overhead)</text>

    <text x="32" y="118" font-size="13" font-weight="700" fill="#52525b" letter-spacing="0.08em">USD PER ACCEPTED TASK BY REVIEW SHARE</text>
    <line x1="32" y1="126" x2="440" y2="126" stroke="#e3e3e0"/>

    <g font-size="14" fill="#52525b">
      <text x="72" y="300" text-anchor="middle">5% reviewed</text>
      <text x="196" y="300" text-anchor="middle">20% reviewed</text>
      <text x="320" y="300" text-anchor="middle">50% reviewed</text>
    </g>

    <g>
      <rect x="52" y="248" width="40" height="40" fill="#6366f1" opacity="0.65" rx="3"/>
      <text x="72" y="240" text-anchor="middle" font-size="15" font-weight="700">$0.63</text>
      <rect x="176" y="198" width="40" height="90" fill="#6366f1" opacity="0.65" rx="3"/>
      <text x="196" y="190" text-anchor="middle" font-size="15" font-weight="700">$0.95</text>
      <rect x="300" y="138" width="40" height="150" fill="#6366f1" opacity="0.65" rx="3"/>
      <text x="320" y="130" text-anchor="middle" font-size="15" font-weight="700">$1.58</text>
      <line x1="32" y1="288" x2="360" y2="288" stroke="#e3e3e0"/>
    </g>

    <text x="480" y="118" font-size="13" font-weight="700" fill="#52525b" letter-spacing="0.08em">20% REVIEW: MONTHLY COST STACK</text>
    <line x1="480" y1="126" x2="768" y2="126" stroke="#e3e3e0"/>

    <g font-size="14">
      <text x="488" y="158">Automated processing</text>
      <text x="760" y="158" text-anchor="end" font-weight="600">$2,000</text>
      <rect x="488" y="166" width="272" height="12" fill="#64748b" opacity="0.65" rx="2"/>

      <text x="488" y="198">Allocated overhead</text>
      <text x="760" y="198" text-anchor="end" font-weight="600">$3,000</text>
      <rect x="488" y="206" width="272" height="12" fill="#0284c7" opacity="0.65" rx="2"/>

      <text x="488" y="238">Human review</text>
      <text x="760" y="238" text-anchor="end" font-weight="600">$4,000</text>
      <rect x="488" y="246" width="272" height="12" fill="#6366f1" opacity="0.65" rx="2"/>

      <text x="488" y="286" font-weight="700">Total operating cost</text>
      <text x="760" y="286" text-anchor="end" font-weight="700">$9,000</text>
      <text x="488" y="308" font-size="13" fill="#52525b">9,500 accepted tasks / month</text>
    </g>

    <text x="32" y="346" font-size="12" fill="#71717a">Matches the table in prose. Financial-error losses, sales, taxes, and other overhead excluded.</text>
    <text x="32" y="366" font-size="11" fill="#71717a">Calculation register: veda.ng/data/finance-research.json</text>
    <text x="768" y="382" text-anchor="end" font-size="13" fill="#52525b">veda.ng/agenticfinance</text>
  </g>
</svg>