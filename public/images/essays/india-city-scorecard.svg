<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#ffffff"/>
  <rect x="0" y="0" width="10" height="630" fill="#4f46e5"/>
  <text x="60" y="80" fill="#71717a" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600">INDIA</text>
  <text x="60" y="145" fill="#18181b" font-family="Inter, Arial, sans-serif" font-size="54" font-weight="700">Cities of India</text>
  <text x="60" y="188" fill="#52525b" font-family="Inter, Arial, sans-serif" font-size="22">Quality of life, spending and prices from government sources</text>
  <line x1="60" y1="230" x2="1140" y2="230" stroke="#e3e3e0"/>

  <text x="60" y="285" fill="#71717a" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600">EASE OF LIVING INDEX, 2020</text>
  <text x="60" y="355" fill="#18181b" font-family="Inter, Arial, sans-serif" font-size="50" font-weight="700">66.70</text>
  <text x="60" y="390" fill="#52525b" font-family="Inter, Arial, sans-serif" font-size="18">Bengaluru, first among Million+ cities</text>

  <text x="460" y="285" fill="#71717a" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600">URBAN SPENDING, 2023-24</text>
  <text x="460" y="355" fill="#18181b" font-family="Inter, Arial, sans-serif" font-size="50" font-weight="700">INR 6,996</text>
  <text x="460" y="390" fill="#52525b" font-family="Inter, Arial, sans-serif" font-size="18">Average monthly spending per person</text>

  <text x="880" y="285" fill="#71717a" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600">URBAN INFLATION, JULY 2026</text>
  <text x="880" y="355" fill="#18181b" font-family="Inter, Arial, sans-serif" font-size="50" font-weight="700">3.96%</text>
  <text x="880" y="390" fill="#52525b" font-family="Inter, Arial, sans-serif" font-size="18">Year-on-year CPI change</text>

  <line x1="60" y1="450" x2="1140" y2="450" stroke="#e3e3e0"/>
  <circle cx="88" cy="520" r="7" fill="#4f46e5"/>
  <text x="110" y="526" fill="#18181b" font-family="Inter, Arial, sans-serif" font-size="18">Chennai leads Quality of Life</text>
  <circle cx="490" cy="520" r="7" fill="#d97706"/>
  <text x="512" y="526" fill="#18181b" font-family="Inter, Arial, sans-serif" font-size="18">Pune leads Sustainability</text>
  <circle cx="860" cy="520" r="7" fill="#15803d"/>
  <text x="882" y="526" fill="#18181b" font-family="Inter, Arial, sans-serif" font-size="18">Surat leads clean-air action</text>
</svg>
