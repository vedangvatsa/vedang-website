    <line x1="383" y1="140" x2="383" y2="690"/>
    <line x1="610" y1="140" x2="610" y2="690"/>
    <line x1="838" y1="140" x2="838" y2="690"/>
    <line x1="1065" y1="140" x2="1065" y2="690"/>
