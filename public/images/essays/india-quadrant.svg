<svg xmlns="http://www.w3.org/2000/svg" width="640" height="760" viewBox="0 0 640 760">
  <rect width="640" height="760" fill="#ffffff"/>
  <text x="36" y="52" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#18181b">Quality of life and cost</text>
  <text x="36" y="84" font-family="Inter, Arial, sans-serif" font-size="16" fill="#71717a">Eight cities with comparable 2020 and 2023-24 data</text>

  <rect x="70" y="100" width="260" height="260" fill="#eef2ff"/>
  <rect x="330" y="100" width="260" height="260" fill="#f0fdf4"/>
  <rect x="70" y="360" width="260" height="260" fill="#f8fafc"/>
  <rect x="330" y="360" width="260" height="260" fill="#fff7ed"/>

  <text x="90" y="128" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#4f46e5">Lower spend / higher quality</text>
  <text x="550" y="128" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#15803d" text-anchor="end">Higher both</text>
  <text x="90" y="596" font-family="Inter, Arial, sans-serif" font-size="16" fill="#64748b">Lower both</text>
  <text x="550" y="596" font-family="Inter, Arial, sans-serif" font-size="16" fill="#d97706" text-anchor="end">Higher spend / lower quality</text>

  <line x1="70" y1="620" x2="590" y2="620" stroke="#18181b" stroke-width="2"/>
  <line x1="70" y1="100" x2="70" y2="620" stroke="#18181b" stroke-width="2"/>
  <line x1="330" y1="100" x2="330" y2="620" stroke="#94a3b8" stroke-width="1" stroke-dasharray="5 5"/>
  <line x1="70" y1="418" x2="590" y2="418" stroke="#94a3b8" stroke-width="1" stroke-dasharray="5 5"/>

  <g font-family="Inter, Arial, sans-serif" font-size="15" fill="#52525b">
    <text x="70" y="645" text-anchor="middle">INR 5,000</text>
    <text x="330" y="645" text-anchor="middle">INR 7,000</text>
    <text x="590" y="645" text-anchor="middle">INR 9,000</text>
    <text x="50" y="625" text-anchor="end">45</text>
    <text x="50" y="423" text-anchor="end">52</text>
    <text x="50" y="105" text-anchor="end">63</text>
    <text x="330" y="690" text-anchor="middle" font-size="16">Monthly household spending proxy</text>
    <text x="330" y="722" text-anchor="middle" font-size="14" fill="#71717a">Quality score rises upward</text>
  </g>

  <g font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#18181b">
    <circle cx="140" cy="190" r="9" fill="#4f46e5"/><text x="158" y="196">Indore</text>
    <circle cx="377" cy="241" r="9" fill="#d97706"/><text x="395" y="247">Pune</text>
    <circle cx="481" cy="160" r="9" fill="#15803d"/><text x="499" y="166">Chennai</text>
    <circle cx="470" cy="312" r="9" fill="#d97706"/><text x="488" y="318">Bengaluru</text>
    <circle cx="529" cy="440" r="9" fill="#d97706"/><text x="529" y="418" text-anchor="middle">Delhi</text>
    <circle cx="587" cy="442" r="9" fill="#d97706"/><text x="587" y="485" text-anchor="middle">Hyderabad</text>
    <circle cx="121" cy="438" r="9" fill="#64748b"/><text x="139" y="444">Lucknow</text>
    <circle cx="274" cy="543" r="9" fill="#64748b"/><text x="292" y="549">Jaipur</text>
  </g>
</svg>
