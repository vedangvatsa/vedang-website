  <line x1="693" y1="140" x2="693" y2="690" stroke="#64748b" stroke-width="1.5" stroke-dasharray="7 7"/>
  <line x1="110" y1="369" x2="1110" y2="369" stroke="#64748b" stroke-width="1.5" stroke-dasharray="7 7"/>

