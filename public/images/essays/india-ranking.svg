    <text x="48" y="182" font-weight="600">2. Pune</text><rect x="250" y="162" width="475" height="24" fill="#4f46e5"/><text x="750" y="182" font-weight="700">66.27</text>
    <text x="48" y="224" font-weight="600">3. Ahmedabad</text><rect x="250" y="204" width="465" height="24" fill="#4f46e5"/><text x="750" y="224" font-weight="700">64.87</text>
    <text x="48" y="266">4. Chennai</text><rect x="250" y="246" width="448" height="24" fill="#94a3b8"/><text x="750" y="266">62.61</text>
    <text x="48" y="308">5. Surat</text><rect x="250" y="288" width="442" height="24" fill="#94a3b8"/><text x="750" y="308">61.73</text>
    <text x="48" y="350">6. Navi Mumbai</text><rect x="250" y="330" width="441" height="24" fill="#94a3b8"/><text x="750" y="350">61.60</text>
    <text x="48" y="392">7. Coimbatore</text><rect x="250" y="372" width="428" height="24" fill="#94a3b8"/><text x="750" y="392">59.72</text>
    <text x="48" y="434">8. Vadodara</text><rect x="250" y="414" width="424" height="24" fill="#94a3b8"/><text x="750" y="434">59.24</text>
    <text x="48" y="476">9. Indore</text><rect x="250" y="456" width="420" height="24" fill="#94a3b8"/><text x="750" y="476">58.58</text>
    <text x="48" y="518">10. Greater Mumbai</text><rect x="250" y="498" width="417" height="24" fill="#94a3b8"/><text x="750" y="518">58.23</text>
