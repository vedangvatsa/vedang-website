<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#ffffff"/>
  <text x="40" y="36" fill="#37352f" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700">Asked, cut, arrived (Rs crore)</text>
  <text x="760" y="36" text-anchor="end" fill="#787774" font-family="Inter, system-ui, sans-serif" font-size="12">One scale. Full bar = Rs 2,000 Cr.</text>

  <text x="40" y="72" fill="#37352f" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700">FY 2024-25</text>
  <text x="40" y="96" fill="#787774" font-family="Inter, system-ui, sans-serif" font-size="13">Asked</text>
  <text x="380" y="96" text-anchor="end" fill="#37352f" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600">551.75</text>
  <rect x="40" y="104" width="88" height="16" rx="2" fill="#e3e3e0"/>
  <text x="40" y="144" fill="#787774" font-family="Inter, system-ui, sans-serif" font-size="13">After the cut</text>
  <text x="380" y="144" text-anchor="end" fill="#37352f" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600">173</text>
  <rect x="40" y="152" width="28" height="16" rx="2" fill="#9b9b97"/>
  <text x="40" y="192" fill="#787774" font-family="Inter, system-ui, sans-serif" font-size="13">Arrived</text>
  <text x="380" y="192" text-anchor="end" fill="#37352f" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600">21.79</text>
  <rect x="40" y="200" width="4" height="16" rx="2" fill="#37352f"/>
  <text x="40" y="236" fill="#787774" font-family="Inter, system-ui, sans-serif" font-size="12">3.9% of the ask</text>

  <text x="420" y="72" fill="#37352f" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700">FY 2025-26</text>
  <text x="420" y="96" fill="#787774" font-family="Inter, system-ui, sans-serif" font-size="13">Asked</text>
  <text x="760" y="96" text-anchor="end" fill="#37352f" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600">2,000</text>
  <rect x="420" y="104" width="320" height="16" rx="2" fill="#e3e3e0"/>
  <text x="420" y="144" fill="#787774" font-family="Inter, system-ui, sans-serif" font-size="13">After the cut</text>
  <text x="760" y="144" text-anchor="end" fill="#37352f" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600">800</text>
  <rect x="420" y="152" width="128" height="16" rx="2" fill="#9b9b97"/>
  <text x="420" y="192" fill="#787774" font-family="Inter, system-ui, sans-serif" font-size="13">Arrived</text>
  <text x="760" y="192" text-anchor="end" fill="#37352f" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600">379.15</text>
  <rect x="420" y="200" width="61" height="16" rx="2" fill="#37352f"/>
  <text x="420" y="236" fill="#787774" font-family="Inter, system-ui, sans-serif" font-size="12">19% of the ask</text>

  <line x1="40" y1="268" x2="760" y2="268" stroke="#e3e3e0" stroke-width="1"/>
  <text x="40" y="300" fill="#37352f" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700">Ceiling Rs 10,371.92 Cr</text>
  <text x="40" y="328" fill="#37352f" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700">Received by 9 Feb 2026: Rs 400.94 Cr (3.9%)</text>
  <text x="40" y="364" fill="#787774" font-family="Inter, system-ui, sans-serif" font-size="12">Rajya Sabha Unstarred Q.1668. Light bar = asked. Mid bar = after the cut. Dark bar = arrived.</text>
  <text x="760" y="364" text-anchor="end" fill="#787774" font-family="Inter, system-ui, sans-serif" font-size="12">veda.ng/indiaai</text>
</svg>
