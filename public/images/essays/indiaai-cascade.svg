<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" width="400" height="520" preserveAspectRatio="xMidYMid meet">
  <style>
    text { font-family: Inter, system-ui, sans-serif; }
    .title { font-size: 16px; font-weight: 600; fill: #18181b; }
    .year { font-size: 14px; font-weight: 600; fill: #18181b; }
    .label { font-size: 13px; fill: #52525b; }
    .value { font-size: 14px; font-weight: 600; fill: #18181b; }
    .note { font-size: 12px; fill: #52525b; }
  </style>

  <text x="16" y="28" class="title">IndiaAI: asked vs arrived (₹ Cr)</text>

  <text x="16" y="58" class="year">FY 2024-25</text>
  <text x="16" y="80" class="label">Budget estimate</text>
  <text x="384" y="80" class="value" text-anchor="end">₹551.75</text>
  <rect x="16" y="88" width="368" height="14" rx="2" fill="#d4d4d8"/>
  <text x="16" y="122" class="label">Revised estimate</text>
  <text x="384" y="122" class="value" text-anchor="end">₹173</text>
  <rect x="16" y="130" width="115" height="14" rx="2" fill="#71717a"/>
  <text x="16" y="164" class="label">Cash received</text>
  <text x="384" y="164" class="value" text-anchor="end">₹21.79</text>
  <rect x="16" y="172" width="15" height="14" rx="2" fill="#18181b"/>

  <text x="16" y="214" class="year">FY 2025-26</text>
  <text x="16" y="236" class="label">Budget estimate</text>
  <text x="384" y="236" class="value" text-anchor="end">₹2,000</text>
  <rect x="16" y="244" width="368" height="14" rx="2" fill="#d4d4d8"/>
  <text x="16" y="278" class="label">Revised estimate</text>
  <text x="384" y="278" class="value" text-anchor="end">₹800</text>
  <rect x="16" y="286" width="147" height="14" rx="2" fill="#71717a"/>
  <text x="16" y="320" class="label">Cash received</text>
  <text x="384" y="320" class="value" text-anchor="end">₹379.15</text>
  <rect x="16" y="328" width="70" height="14" rx="2" fill="#18181b"/>

  <text x="16" y="372" class="note">Year 1: 3.9% of the ask arrived. Year 2: 19%.</text>
  <text x="16" y="396" class="value">Ceiling: ₹10,371.92 Cr</text>
  <text x="16" y="418" class="value">Received by 9 Feb 2026: ₹400.94 Cr (3.9%)</text>
  <text x="16" y="448" class="note">Rajya Sabha Unstarred Q.1668, 13 Feb 2026.</text>
  <text x="16" y="468" class="note">FY 2025-26 cut-off 9 Feb 2026.</text>
  <text x="16" y="500" class="note">Gray bars are the ask. Black bars are what arrived.</text>
</svg>
