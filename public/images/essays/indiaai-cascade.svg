<svg xmlns="http://www.w3.org/2000/svg" width="800" height="220" viewBox="0 0 800 220">
  <rect width="800" height="220" fill="#ffffff"/>
  <text x="20" y="22" fill="#37352f" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700">Asked, cut, arrived (Rs crore)</text>
  <text x="780" y="22" text-anchor="end" fill="#787774" font-family="Inter, system-ui, sans-serif" font-size="11">One scale. Full bar = Rs 2,000 Cr.</text>

  <text x="20" y="50" fill="#37352f" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700">FY 2024-25</text>
  <text x="20" y="72" fill="#787774" font-family="Inter, system-ui, sans-serif" font-size="12">Asked</text>
  <rect x="88" y="62" width="61" height="12" rx="2" fill="#e3e3e0"/>
  <text x="380" y="72" text-anchor="end" fill="#37352f" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">551.75</text>
  <text x="20" y="94" fill="#787774" font-family="Inter, system-ui, sans-serif" font-size="12">Cut to</text>
  <rect x="88" y="84" width="19" height="12" rx="2" fill="#9b9b97"/>
  <text x="380" y="94" text-anchor="end" fill="#37352f" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">173</text>
  <text x="20" y="116" fill="#787774" font-family="Inter, system-ui, sans-serif" font-size="12">Arrived</text>
  <rect x="88" y="106" width="3" height="12" rx="2" fill="#37352f"/>
  <text x="380" y="116" text-anchor="end" fill="#37352f" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">21.79</text>
  <text x="20" y="136" fill="#787774" font-family="Inter, system-ui, sans-serif" font-size="11">3.9% of the ask</text>

  <text x="420" y="50" fill="#37352f" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700">FY 2025-26</text>
  <text x="420" y="72" fill="#787774" font-family="Inter, system-ui, sans-serif" font-size="12">Asked</text>
  <rect x="488" y="62" width="220" height="12" rx="2" fill="#e3e3e0"/>
  <text x="780" y="72" text-anchor="end" fill="#37352f" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">2,000</text>
  <text x="420" y="94" fill="#787774" font-family="Inter, system-ui, sans-serif" font-size="12">Cut to</text>
  <rect x="488" y="84" width="88" height="12" rx="2" fill="#9b9b97"/>
  <text x="780" y="94" text-anchor="end" fill="#37352f" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">800</text>
  <text x="420" y="116" fill="#787774" font-family="Inter, system-ui, sans-serif" font-size="12">Arrived</text>
  <rect x="488" y="106" width="42" height="12" rx="2" fill="#37352f"/>
  <text x="780" y="116" text-anchor="end" fill="#37352f" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">379.15</text>
  <text x="420" y="136" fill="#787774" font-family="Inter, system-ui, sans-serif" font-size="11">19% of the ask</text>

  <text x="20" y="168" fill="#37352f" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700">Ceiling Rs 10,371.92 Cr. Received by 9 Feb 2026: Rs 400.94 Cr (3.9%).</text>
  <text x="20" y="192" fill="#787774" font-family="Inter, system-ui, sans-serif" font-size="11">Rajya Sabha Q.1668. Light = asked. Mid = after the cut. Dark = arrived.</text>
  <text x="20" y="210" fill="#787774" font-family="Inter, system-ui, sans-serif" font-size="11">FY 2026-27 ask is Rs 1,000 Cr. Zero received is a 9 Feb cut-off, not the full year.</text>
</svg>
