<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 328" width="720" height="328">
  <style>
    text { font-family: Inter, system-ui, sans-serif; }
    .title { font-size: 14px; font-weight: 600; fill: #18181b; }
    .label { font-size: 11px; fill: #3f3f46; }
    .value { font-size: 11px; font-weight: 600; fill: #18181b; }
    .note { font-size: 10px; fill: #52525b; }
    .axis { stroke: #e4e4e7; stroke-width: 1; }
  </style>
  <!-- Title -->
  <text x="40" y="30" class="title">IndiaAI: Budget Estimate → Revised Estimate → Cash Received (₹ Crore)</text>
  
  <!-- FY 2024-25 bars -->
  <text x="60" y="65" class="label">FY 2024-25</text>
  <!-- BE bar -->
  <rect x="170" y="48" width="330" height="14" rx="2" fill="#d4d4d8"/>
  <text x="508" y="60" class="value">₹551.75 Cr (BE)</text>
  <!-- RE bar -->
  <rect x="170" y="68" width="104" height="14" rx="2" fill="#71717a"/>
  <text x="282" y="80" class="value">₹173 Cr (RE)</text>
  <!-- Received bar -->
  <rect x="170" y="88" width="13" height="14" rx="2" fill="#18181b"/>
  <text x="191" y="100" class="value">₹21.79 Cr</text>
  
  <!-- FY 2025-26 bars -->
  <text x="60" y="140" class="label">FY 2025-26</text>
  <rect x="170" y="123" width="330" height="14" rx="2" fill="#d4d4d8"/>
  <text x="508" y="135" class="value">₹2,000 Cr (BE)</text>
  <rect x="170" y="143" width="132" height="14" rx="2" fill="#71717a"/>
  <text x="310" y="155" class="value">₹800 Cr (RE)</text>
  <rect x="170" y="163" width="63" height="14" rx="2" fill="#18181b"/>
  <text x="241" y="175" class="value">₹379.15 Cr</text>
  
  <!-- Source -->
  <text x="40" y="210" class="note">Source: Rajya Sabha Unstarred Q.1668 (13 Feb 2026). FY 2025-26 cut-off 9 Feb 2026.</text>
  <text x="40" y="225" class="note">BE = Budget Estimate. RE = Revised Estimate. Gray bars are the ask. Black bars are what arrived.</text>
  
  <!-- Percentage annotations -->
  <text x="40" y="255" class="label">Year 1: 3.9% of what MeitY asked for reached IndiaAI. Year 2: 19%.</text>
  
  <!-- Five-year ceiling reference -->
  <line x1="40" y1="280" x2="720" y2="280" class="axis"/>
  <text x="40" y="298" class="note">Five-year Cabinet ceiling: ₹10,371.92 Cr (March 2024)</text>
  <text x="40" y="313" class="value">Total received by 9 Feb 2026: ₹400.94 Cr (3.9% of ceiling)</text>
</svg>