<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 290" width="640" height="290">
  <style>
    text { font-family: Inter, system-ui, sans-serif; }
    .title { font-size: 14px; font-weight: 600; fill: #18181b; }
    .onbar { font-size: 12px; font-weight: 600; }
    .count { font-size: 12px; fill: #18181b; }
    .share { font-size: 11px; fill: #3f3f46; }
    .note { font-size: 10px; fill: #52525b; }
  </style>

  <text x="40" y="28" class="title">IndiaAI compute: committed, assigned, utilised (GPUs)</text>

  <rect x="40" y="48" width="420" height="36" rx="3" fill="#d4d4d8"/>
  <text x="56" y="71" class="onbar" fill="#18181b">Committed</text>
  <text x="480" y="64" class="count">33,099 GPUs</text>
  <text x="480" y="80" class="share">100%</text>

  <text x="250" y="104" text-anchor="middle" fill="#71717a" font-size="10">▼</text>

  <rect x="40" y="112" width="160" height="36" rx="3" fill="#52525b"/>
  <text x="56" y="135" class="onbar" fill="#fafafa">Assigned</text>
  <text x="220" y="128" class="count">12,638</text>
  <text x="220" y="144" class="share">38% of committed</text>

  <text x="120" y="168" text-anchor="middle" fill="#71717a" font-size="10">▼</text>

  <rect x="40" y="176" width="94" height="36" rx="3" fill="#18181b"/>
  <text x="56" y="199" class="onbar" fill="#fafafa">Utilised</text>
  <text x="150" y="192" class="count">7,418</text>
  <text x="150" y="208" class="share">22% of committed</text>

  <text x="40" y="240" class="note">Source: Economic Times, citing an IndiaAI letter to providers. Press-reported.</text>
  <text x="40" y="256" class="note">MeitY told Parliament 38,000+ GPUs were onboarded. 305 user slots were listed in the same reply.</text>
  <text x="40" y="272" class="note">One listed slot for every 108 committed GPUs. Capacity is pooled, so that is not GPUs per user.</text>
</svg>
