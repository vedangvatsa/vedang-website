<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 340" width="400" height="340" preserveAspectRatio="xMidYMid meet">
  <style>
    text { font-family: Inter, system-ui, sans-serif; }
    .title { font-size: 16px; font-weight: 600; fill: #18181b; }
    .onbar { font-size: 14px; font-weight: 600; }
    .count { font-size: 15px; font-weight: 600; fill: #18181b; }
    .share { font-size: 13px; fill: #52525b; }
    .note { font-size: 12px; fill: #52525b; }
  </style>

  <text x="16" y="28" class="title">Committed, assigned, utilised</text>

  <rect x="16" y="48" width="368" height="44" rx="3" fill="#d4d4d8"/>
  <text x="28" y="68" class="onbar" fill="#18181b">Committed</text>
  <text x="28" y="86" class="share">33,099 GPUs · 100%</text>

  <text x="200" y="114" text-anchor="middle" fill="#71717a" font-size="12">▼</text>

  <rect x="16" y="124" width="140" height="44" rx="3" fill="#52525b"/>
  <text x="168" y="144" class="count">12,638</text>
  <text x="168" y="162" class="share">Assigned · 38%</text>

  <text x="86" y="190" text-anchor="middle" fill="#71717a" font-size="12">▼</text>

  <rect x="16" y="200" width="82" height="44" rx="3" fill="#18181b"/>
  <text x="110" y="220" class="count">7,418</text>
  <text x="110" y="238" class="share">Utilised · 22%</text>

  <text x="16" y="280" class="note">Press-reported, citing an IndiaAI letter.</text>
  <text x="16" y="300" class="note">MeitY told Parliament 38,000+ GPUs onboarded.</text>
  <text x="16" y="324" class="note">Capacity is pooled, not GPUs per user.</text>
</svg>
