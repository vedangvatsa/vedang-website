  <text x="40" y="348" fill="#37352f" fill-opacity="0.35" font-size="10">FY24-25 ₹21.79 Cr of RE ₹173 Cr · FY25-26 ₹379.15 Cr of RE ₹800 Cr (as of 9 Feb 2026)</text>
  <text x="40" y="370" fill="#37352f" fill-opacity="0.3" font-size="9">Sources. Union Cabinet / PIB (Mar 2024); Rajya Sabha Unstarred Q.1668 (answered 13 Feb 2026). Verification date Aug 2026.</text>
