  <text x="760" y="192" text-anchor="end" fill="hsl(0, 70%, 50%)" font-size="12" font-weight="700">₹400.94 Cr</text>
  <rect x="40" y="202" width="720" height="28" rx="3" fill="#f4f4f0"/>
