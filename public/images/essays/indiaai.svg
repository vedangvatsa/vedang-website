  <text x="760" y="112" text-anchor="end" fill="#37352f" font-size="12" font-weight="700">₹10,371.92 Cr</text>
  <rect x="40" y="122" width="720" height="28" rx="3" fill="#37352f" fill-opacity="0.12"/>
  <rect x="40" y="122" width="720" height="28" rx="3" fill="#37352f" fill-opacity="0.65"/>

