<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif">
  <rect width="900" height="400" fill="white" rx="3"/>
  <rect width="900" height="400" fill="white" rx="3" stroke="#e3e3e0" stroke-width="1"/>

  <text x="450" y="36" text-anchor="middle" fill="#37352f" font-size="18" font-weight="700" letter-spacing="-0.3">IndiaAI Mission: Announced vs Released</text>
  <text x="450" y="54" text-anchor="middle" fill="#37352f" opacity="0.4" font-size="10" letter-spacing="0.5">FIVE-YEAR OUTLAY vs CASH RECEIVED BY INDIAIAI | AS OF 9 FEB 2026</text>

  <!-- Left: Outlay -->
  <rect x="40" y="80" width="400" height="250" rx="6" fill="#2563eb" opacity="0.06" stroke="#2563eb" stroke-opacity="0.25"/>
  <text x="240" y="110" text-anchor="middle" fill="#2563eb" font-size="11" font-weight="700" letter-spacing="0.5">CABINET OUTLAY (5 YEARS)</text>
  <text x="240" y="165" text-anchor="middle" fill="#2563eb" font-size="42" font-weight="800">&#x20B9;10,372</text>
  <text x="240" y="190" text-anchor="middle" fill="#37352f" opacity="0.55" font-size="13" font-weight="600">crore approved</text>
  <text x="240" y="220" text-anchor="middle" fill="#37352f" opacity="0.45" font-size="11">March 2024 Cabinet decision</text>
  <text x="240" y="245" text-anchor="middle" fill="#37352f" opacity="0.45" font-size="11">Exact figure: &#x20B9;10,371.92 Cr</text>
  <text x="240" y="285" text-anchor="middle" fill="#37352f" opacity="0.4" font-size="10">Seven pillars + 1% overhead</text>
  <text x="240" y="305" text-anchor="middle" fill="#37352f" opacity="0.4" font-size="10">Largest slice: Compute &#x20B9;4,563 Cr</text>

  <!-- Right: Released -->
  <rect x="460" y="80" width="400" height="250" rx="6" fill="#dc2626" opacity="0.06" stroke="#dc2626" stroke-opacity="0.25"/>
  <text x="660" y="110" text-anchor="middle" fill="#dc2626" font-size="11" font-weight="700" letter-spacing="0.5">CASH TO INDIAIAI (TO DATE)</text>
  <text x="660" y="165" text-anchor="middle" fill="#dc2626" font-size="42" font-weight="800">&#x20B9;401</text>
  <text x="660" y="190" text-anchor="middle" fill="#37352f" opacity="0.55" font-size="13" font-weight="600">crore received</text>
  <text x="660" y="220" text-anchor="middle" fill="#37352f" opacity="0.45" font-size="11">FY24-25: &#x20B9;21.79 Cr of RE &#x20B9;173 Cr</text>
  <text x="660" y="245" text-anchor="middle" fill="#37352f" opacity="0.45" font-size="11">FY25-26: &#x20B9;379.15 Cr of RE &#x20B9;800 Cr</text>
  <text x="660" y="285" text-anchor="middle" fill="#dc2626" font-size="14" font-weight="700">3.9% of total outlay</text>
  <text x="660" y="305" text-anchor="middle" fill="#37352f" opacity="0.4" font-size="10">Exact sum: &#x20B9;400.94 Cr</text>

  <line x1="40" y1="350" x2="860" y2="350" stroke="#e3e3e0" stroke-width="0.5"/>
  <text x="450" y="375" text-anchor="middle" fill="#37352f" opacity="0.35" font-size="9">Sources: Union Cabinet / PIB (Mar 2024); Rajya Sabha Unstarred Q.1668, answered 13 Feb 2026 (MeitY). Verification date: Aug 2026.</text>
</svg>
