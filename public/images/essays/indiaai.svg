<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
  <rect width="900" height="380" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="899" height="379" fill="none" stroke="#d6d3d1" stroke-width="1"/>

  <text x="40" y="42" fill="#37352f" font-size="20" font-weight="600" letter-spacing="-0.4">₹10,372 Cr approved. ₹401 Cr received.</text>
  <text x="40" y="64" fill="#37352f" fill-opacity="0.55" font-size="11">IndiaAI Mission cash vs Cabinet outlay | cut-off 9 Feb 2026</text>

  <!-- Full outlay track -->
  <text x="40" y="110" fill="#37352f" fill-opacity="0.7" font-size="11" font-weight="500">Cabinet outlay</text>
  <text x="860" y="110" text-anchor="end" fill="#37352f" font-size="13" font-weight="600">₹10,371.92 Cr</text>
  <rect x="40" y="120" width="820" height="36" fill="#37352f"/>

  <!-- Received as thin slice (3.9% of 820 ≈ 32px) -->
  <text x="40" y="190" fill="#9f1239" font-size="11" font-weight="500">Cash received by IndiaAI</text>
  <text x="860" y="190" text-anchor="end" fill="#9f1239" font-size="13" font-weight="600">₹400.94 Cr</text>
  <rect x="40" y="200" width="820" height="36" fill="#37352f" fill-opacity="0.08"/>
  <rect x="40" y="200" width="32" height="36" fill="#9f1239"/>

  <!-- Callout numbers -->
  <text x="40" y="280" fill="#9f1239" font-size="40" font-weight="700" letter-spacing="-1">3.9%</text>
  <text x="160" y="262" fill="#37352f" fill-opacity="0.75" font-size="12">of the five-year ceiling</text>
  <text x="160" y="282" fill="#37352f" fill-opacity="0.75" font-size="12">reached IndiaAI by the parliamentary cut-off</text>

  <line x1="40" y1="310" x2="860" y2="310" stroke="#d6d3d1" stroke-width="1"/>
  <text x="40" y="335" fill="#37352f" fill-opacity="0.45" font-size="10">FY24-25 ₹21.79 Cr of RE ₹173 Cr · FY25-26 ₹379.15 Cr of RE ₹800 Cr (as of 9 Feb 2026)</text>
  <text x="40" y="355" fill="#37352f" fill-opacity="0.4" font-size="9">Sources. Union Cabinet / PIB (Mar 2024); Rajya Sabha Unstarred Q.1668 (answered 13 Feb 2026). Verification date Aug 2026.</text>
</svg>
