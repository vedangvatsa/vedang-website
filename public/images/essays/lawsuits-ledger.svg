<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 548" width="400" height="548" preserveAspectRatio="xMidYMid meet">
  <style>
    text { font-family: Inter, system-ui, sans-serif; }
    .title { font-size: 16px; font-weight: 600; fill: #18181b; }
    .name { font-size: 15px; font-weight: 600; fill: #18181b; }
    .row { font-size: 13px; fill: #18181b; }
    .dim { font-size: 13px; fill: #52525b; }
    .note { font-size: 12px; fill: #52525b; }
  </style>

  <text x="16" y="28" class="title">Filed, decided, paid</text>

  <rect x="16" y="44" width="368" height="72" fill="#f4f4f5"/>
  <text x="28" y="66" class="name">Bartz v. Anthropic</text>
  <text x="28" y="86" class="row">Settled. Final approval 20 Jul 2026</text>
  <text x="28" y="106" class="row">$1.5B fund, about $3,000/title</text>

  <rect x="16" y="116" width="368" height="72" fill="#ffffff"/>
  <text x="28" y="138" class="name">NYT v. OpenAI / Microsoft</text>
  <text x="28" y="158" class="row">Active. SJ set Apr 2026</text>
  <text x="28" y="178" class="dim">Billions claimed. $28M spent suing</text>

  <rect x="16" y="188" width="368" height="72" fill="#f4f4f5"/>
  <text x="28" y="210" class="name">Getty v. Stability (UK)</text>
  <text x="28" y="230" class="row">Decided 4 Nov 2025</text>
  <text x="28" y="250" class="dim">Weights held not to be copies</text>

  <rect x="16" y="260" width="368" height="72" fill="#ffffff"/>
  <text x="28" y="282" class="name">GEMA v. OpenAI (Munich)</text>
  <text x="28" y="302" class="row">Plaintiff. On appeal</text>
  <text x="28" y="322" class="dim">Lyric memorization = reproduction</text>

  <rect x="16" y="332" width="368" height="72" fill="#f4f4f5"/>
  <text x="28" y="354" class="name">Warner v. Udio</text>
  <text x="28" y="374" class="row">Settled Apr 2026</text>
  <text x="28" y="394" class="dim">Partnership. Terms confidential</text>

  <rect x="16" y="404" width="368" height="72" fill="#ffffff"/>
  <text x="28" y="426" class="name">Authors Guild v. OpenAI</text>
  <text x="28" y="446" class="row">Active. Output claims survive</text>
  <text x="28" y="466" class="dim">Class-wide. No paid close</text>

  <text x="16" y="516" class="note">Bartz is the only nine-figure cash close.</text>
  <text x="16" y="536" class="note">Tracker, June 2026: 200 AI suits, 68 defendants.</text>
</svg>
