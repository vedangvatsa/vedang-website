<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 292" width="720" height="292">
  <style>
    text { font-family: Inter, system-ui, sans-serif; }
    .title { font-size: 13px; font-weight: 600; fill: #18181b; }
    .head { font-size: 11px; font-weight: 600; fill: #fafafa; }
    .cell { font-size: 11px; fill: #18181b; }
    .dim { font-size: 11px; fill: #3f3f46; }
    .note { font-size: 10px; fill: #52525b; }
  </style>
  <text x="24" y="22" class="title">Filed, decided, paid. Six cases that set the money.</text>
  <rect x="24" y="34" width="672" height="26" fill="#18181b"/>
  <text x="36" y="51" class="head">Case</text>
  <text x="250" y="51" class="head">Status</text>
  <text x="430" y="51" class="head">Money on the docket</text>
  <rect x="24" y="60" width="672" height="26" fill="#f4f4f5"/>
  <text x="36" y="77" class="cell" font-weight="600">Bartz v. Anthropic</text>
  <text x="250" y="77" class="cell">Settled. Final approval 20 Jul 2026</text>
  <text x="430" y="77" class="cell">$1.5B fund, about $3,000/title</text>
  <rect x="24" y="86" width="672" height="26" fill="#ffffff"/>
  <text x="36" y="103" class="cell" font-weight="600">NYT v. OpenAI &amp; Microsoft</text>
  <text x="250" y="103" class="cell">Active. SJ set Apr 2026</text>
  <text x="430" y="103" class="dim">"Billions" claimed. $28M spent suing</text>
  <rect x="24" y="112" width="672" height="26" fill="#f4f4f5"/>
  <text x="36" y="129" class="cell" font-weight="600">Getty v. Stability (UK)</text>
  <text x="250" y="129" class="cell">Decided 4 Nov 2025</text>
  <text x="430" y="129" class="dim">Weights held not to be copies</text>
  <rect x="24" y="138" width="672" height="26" fill="#ffffff"/>
  <text x="36" y="155" class="cell" font-weight="600">GEMA v. OpenAI (Munich)</text>
  <text x="250" y="155" class="cell">Plaintiff. On appeal</text>
  <text x="430" y="155" class="dim">Lyric memorization = reproduction</text>
  <rect x="24" y="164" width="672" height="26" fill="#f4f4f5"/>
  <text x="36" y="181" class="cell" font-weight="600">Warner v. Udio</text>
  <text x="250" y="181" class="cell">Settled Apr 2026</text>
  <text x="430" y="181" class="dim">Partnership. Terms confidential</text>
  <rect x="24" y="190" width="672" height="26" fill="#ffffff"/>
  <text x="36" y="207" class="cell" font-weight="600">Authors Guild v. OpenAI</text>
  <text x="250" y="207" class="cell">Active. Output claims survive</text>
  <text x="430" y="207" class="dim">Class-wide. No paid close</text>
  <text x="24" y="236" class="note">Tracker count as of June 2026: 200 AI suits, 68 defendants, 130 copyright cases, $6B+ disclosed stakes.</text>
  <text x="24" y="252" class="note">Bartz is the only nine-figure cash close. NYT has spent more on lawyers than most plaintiffs will ever collect.</text>
  <text x="24" y="268" class="note">Sources: Reuters 21 Jul 2026; [2025] EWHC 2863 (Ch); ailawsuittracker.com; Variety 9 Jul 2026.</text>
</svg>
