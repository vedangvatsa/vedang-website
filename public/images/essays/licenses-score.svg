<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300">
  <style>
    text { font-family: Inter, system-ui, sans-serif; }
    .title { font-size: 13px; font-weight: 600; fill: #18181b; }
    .head { font-size: 11px; font-weight: 600; fill: #fafafa; }
    .cell { font-size: 11px; fill: #18181b; }
    .dim { font-size: 11px; fill: #3f3f46; }
    .note { font-size: 10px; fill: #52525b; }
  </style>
  <text x="24" y="22" class="title">What "open" actually gives you, August 2026</text>
  <rect x="24" y="34" width="672" height="26" fill="#18181b"/>
  <text x="36" y="51" class="head">Family</text>
  <text x="168" y="51" class="head">Licence on weights</text>
  <text x="400" y="51" class="head">Commercial use</text>
  <text x="580" y="51" class="head">Training data</text>
  <rect x="24" y="60" width="672" height="26" fill="#f4f4f5"/>
  <text x="36" y="77" class="cell" font-weight="600">Qwen 3.x</text>
  <text x="168" y="77" class="cell">Apache 2.0</text>
  <text x="400" y="77" class="cell">Yes</text>
  <text x="580" y="77" class="dim">Not published</text>
  <rect x="24" y="86" width="672" height="26" fill="#ffffff"/>
  <text x="36" y="103" class="cell" font-weight="600">Gemma 4</text>
  <text x="168" y="103" class="cell">Apache 2.0</text>
  <text x="400" y="103" class="cell">Yes</text>
  <text x="580" y="103" class="dim">Not published</text>
  <rect x="24" y="112" width="672" height="26" fill="#f4f4f5"/>
  <text x="36" y="129" class="cell" font-weight="600">DeepSeek R1 / V4</text>
  <text x="168" y="129" class="cell">MIT</text>
  <text x="400" y="129" class="cell">Yes</text>
  <text x="580" y="129" class="dim">Not published</text>
  <rect x="24" y="138" width="672" height="26" fill="#ffffff"/>
  <text x="36" y="155" class="cell" font-weight="600">gpt-oss</text>
  <text x="168" y="155" class="cell">Apache 2.0 + usage policy</text>
  <text x="400" y="155" class="cell">Yes, with policy</text>
  <text x="580" y="155" class="dim">Not published</text>
  <rect x="24" y="164" width="672" height="26" fill="#f4f4f5"/>
  <text x="36" y="181" class="cell" font-weight="600">Mistral (open line)</text>
  <text x="168" y="181" class="cell">Apache 2.0 on most</text>
  <text x="400" y="181" class="cell">Yes on Apache models</text>
  <text x="580" y="181" class="dim">Not published</text>
  <rect x="24" y="190" width="672" height="26" fill="#ffffff"/>
  <text x="36" y="207" class="cell" font-weight="600">Llama 4</text>
  <text x="168" y="207" class="cell">Llama 4 Community</text>
  <text x="400" y="207" class="cell">Yes under 700M MAU</text>
  <text x="580" y="207" class="dim">Not published</text>
  <text x="24" y="236" class="note">Read from Hugging Face model cards and vendor licence files, August 2026. A family can ship more than one licence.</text>
  <text x="24" y="252" class="note">Apache 2.0 and MIT are OSI licences. Llama Community is not. None of these rows publish the training corpus.</text>
  <text x="24" y="268" class="note">Sources: Hugging Face cards for Qwen, google/gemma, deepseek-ai, openai/gpt-oss, mistralai, meta-llama.</text>
</svg>
