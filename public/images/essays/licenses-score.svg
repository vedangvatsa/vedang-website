<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 620" width="400" height="620" preserveAspectRatio="xMidYMid meet">
  <style>
    text { font-family: Inter, system-ui, sans-serif; }
    .title { font-size: 16px; font-weight: 600; fill: #18181b; }
    .name { font-size: 15px; font-weight: 600; fill: #18181b; }
    .row { font-size: 13px; fill: #18181b; }
    .dim { font-size: 13px; fill: #52525b; }
    .note { font-size: 12px; fill: #52525b; }
  </style>

  <text x="16" y="28" class="title">What "open" actually gives you</text>

  <rect x="16" y="44" width="368" height="72" fill="#f4f4f5"/>
  <text x="28" y="66" class="name">Qwen 3.x</text>
  <text x="28" y="86" class="row">Apache 2.0 · Commercial: Yes</text>
  <text x="28" y="106" class="dim">Training data: not published</text>

  <rect x="16" y="116" width="368" height="72" fill="#ffffff"/>
  <text x="28" y="138" class="name">Gemma 4</text>
  <text x="28" y="158" class="row">Apache 2.0 · Commercial: Yes</text>
  <text x="28" y="178" class="dim">Training data: not published</text>

  <rect x="16" y="188" width="368" height="72" fill="#f4f4f5"/>
  <text x="28" y="210" class="name">DeepSeek R1 / V4</text>
  <text x="28" y="230" class="row">MIT · Commercial: Yes</text>
  <text x="28" y="250" class="dim">Training data: not published</text>

  <rect x="16" y="260" width="368" height="72" fill="#ffffff"/>
  <text x="28" y="282" class="name">gpt-oss</text>
  <text x="28" y="302" class="row">Apache 2.0 + usage policy</text>
  <text x="28" y="322" class="dim">Commercial: Yes, with policy</text>

  <rect x="16" y="332" width="368" height="72" fill="#f4f4f5"/>
  <text x="28" y="354" class="name">Mistral (open line)</text>
  <text x="28" y="374" class="row">Apache 2.0 on most</text>
  <text x="28" y="394" class="dim">Commercial: Yes on Apache models</text>

  <rect x="16" y="404" width="368" height="72" fill="#ffffff"/>
  <text x="28" y="426" class="name">Llama 4</text>
  <text x="28" y="446" class="row">Llama 4 Community</text>
  <text x="28" y="466" class="dim">Yes under 700M MAU · Data: no</text>

  <rect x="16" y="476" width="368" height="72" fill="#f4f4f5"/>
  <text x="28" y="498" class="name">Phi-4</text>
  <text x="28" y="518" class="row">MIT · Commercial: Yes</text>
  <text x="28" y="538" class="dim">Training data: not published</text>

  <text x="16" y="580" class="note">Apache 2.0 and MIT are OSI licences.</text>
  <text x="16" y="600" class="note">Llama Community is not. None publish the corpus.</text>
</svg>
