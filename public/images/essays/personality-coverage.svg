<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" role="img" aria-labelledby="chart-title chart-description" font-family="Arial, Helvetica, sans-serif">
  <title id="chart-title">How many models had enough answers?</title>
  <desc id="chart-description">55 tested model setups; 47 have at least one reported trait score; 22 have all five.</desc>
  <rect width="800" height="400" fill="#ffffff" />
  <text x="34" y="48" font-size="29" fill="#37352f" font-weight="700" text-anchor="start">How many models had enough answers?</text>
  <rect x="34" y="100" width="216" height="200" rx="10" fill="#eef2ff" stroke="#c7d2fe" />
  <text x="142" y="185" font-size="68" fill="#4f46e5" font-weight="700" text-anchor="middle">55</text>
  <text x="142" y="234" font-size="23" fill="#37352f" font-weight="400" text-anchor="middle">Model setups</text>
  <text x="142" y="266" font-size="22" fill="#52525b" font-weight="400" text-anchor="middle">tested</text>
  <rect x="292" y="100" width="216" height="200" rx="10" fill="#eef2ff" stroke="#c7d2fe" />
  <text x="400" y="185" font-size="68" fill="#4f46e5" font-weight="700" text-anchor="middle">47</text>
  <text x="400" y="234" font-size="23" fill="#37352f" font-weight="400" text-anchor="middle">At least one</text>
  <text x="400" y="266" font-size="22" fill="#52525b" font-weight="400" text-anchor="middle">trait score</text>
  <rect x="550" y="100" width="216" height="200" rx="10" fill="#eef2ff" stroke="#c7d2fe" />
  <text x="658" y="185" font-size="68" fill="#4f46e5" font-weight="700" text-anchor="middle">22</text>
  <text x="658" y="234" font-size="23" fill="#37352f" font-weight="400" text-anchor="middle">All five</text>
  <text x="658" y="266" font-size="22" fill="#52525b" font-weight="400" text-anchor="middle">trait scores</text>
  <text x="400" y="355" font-size="24" fill="#37352f" font-weight="400" text-anchor="middle">Some answers were marked not applicable.</text>
</svg>