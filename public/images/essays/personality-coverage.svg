<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" role="img" aria-labelledby="chart-title chart-description" font-family="Arial, Helvetica, sans-serif">
  <title id="chart-title">Which models produced reportable profiles?</title>
  <desc id="chart-description">55 tested configurations; 47 have at least one eligible trait; 22 have all five.</desc>
  <rect width="800" height="400" fill="#ffffff" />
  <text x="34" y="48" font-size="29" fill="#37352f" font-weight="700" text-anchor="start">Which models produced reportable profiles?</text>
  <rect x="34" y="100" width="216" height="200" rx="10" fill="#eef2ff" stroke="#c7d2fe" />
  <text x="142" y="185" font-size="68" fill="#4f46e5" font-weight="700" text-anchor="middle">55</text>
  <text x="142" y="234" font-size="23" fill="#37352f" font-weight="400" text-anchor="middle">Configurations</text>
  <text x="142" y="266" font-size="22" fill="#52525b" font-weight="400" text-anchor="middle">in the comparison</text>
  <rect x="292" y="100" width="216" height="200" rx="10" fill="#eef2ff" stroke="#c7d2fe" />
  <text x="400" y="185" font-size="68" fill="#4f46e5" font-weight="700" text-anchor="middle">47</text>
  <text x="400" y="234" font-size="23" fill="#37352f" font-weight="400" text-anchor="middle">At least one</text>
  <text x="400" y="266" font-size="22" fill="#52525b" font-weight="400" text-anchor="middle">reportable trait</text>
  <rect x="550" y="100" width="216" height="200" rx="10" fill="#eef2ff" stroke="#c7d2fe" />
  <text x="658" y="185" font-size="68" fill="#4f46e5" font-weight="700" text-anchor="middle">22</text>
  <text x="658" y="234" font-size="23" fill="#37352f" font-weight="400" text-anchor="middle">All five traits</text>
  <text x="658" y="266" font-size="22" fill="#52525b" font-weight="400" text-anchor="middle">reportable</text>
  <text x="400" y="355" font-size="24" fill="#37352f" font-weight="400" text-anchor="middle">A complete answer map can still leave a trait unscored.</text>
</svg>