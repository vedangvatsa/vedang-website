  <text x="766" y="276" font-size="24" fill="#4f46e5" font-weight="700" text-anchor="end">25 / 55</text>
  <rect x="34" y="292" width="732" height="23" rx="4" fill="#f1f5f9" />
  <rect x="34" y="292" width="332.72727272727275" height="23" rx="4" fill="#4f46e5" fill-opacity=".75" />
  <text x="34" y="364" font-size="24" fill="#37352f" font-weight="400" text-anchor="start">Emotional Stability</text>
  <text x="766" y="364" font-size="24" fill="#4f46e5" font-weight="700" text-anchor="end">38 / 55</text>
  <rect x="34" y="380" width="732" height="23" rx="4" fill="#f1f5f9" />
