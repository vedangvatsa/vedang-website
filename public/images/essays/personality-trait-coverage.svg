<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="570" viewBox="0 0 800 570" role="img" aria-labelledby="chart-title chart-description" font-family="Arial, Helvetica, sans-serif">
  <title id="chart-title">Models with a score for each trait</title>
