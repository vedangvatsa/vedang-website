<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" preserveAspectRatio="xMidYMid meet">
  <style>
    text { font-family: Inter, system-ui, sans-serif; }
    .title { font-size: 22px; font-weight: 700; fill: #18181b; }
    .label { font-size: 18px; font-weight: 700; fill: #18181b; }
    .sub { font-size: 14px; fill: #52525b; }
    .note { font-size: 12px; fill: #71717a; }
  </style>
  <rect width="800" height="400" fill="#ffffff"/>

  <text x="400" y="44" text-anchor="middle" class="title">One fact, many feeds</text>

  <rect x="340" y="88" width="120" height="56" fill="#f4f4f5" stroke="#18181b" stroke-width="1.5"/>
  <text x="400" y="122" text-anchor="middle" class="label">Event</text>

  <line x1="400" y1="144" x2="160" y2="220" stroke="#18181b" stroke-width="1.5"/>
  <line x1="400" y1="144" x2="280" y2="220" stroke="#18181b" stroke-width="1.5"/>
  <line x1="400" y1="144" x2="400" y2="220" stroke="#18181b" stroke-width="1.5"/>
  <line x1="400" y1="144" x2="520" y2="220" stroke="#18181b" stroke-width="1.5"/>
  <line x1="400" y1="144" x2="640" y2="220" stroke="#18181b" stroke-width="1.5"/>

  <rect x="80" y="220" width="160" height="72" fill="#f4f4f5"/>
  <text x="160" y="252" text-anchor="middle" class="sub">Feed A</text>
  <text x="160" y="274" text-anchor="middle" class="sub">story 1</text>

  <rect x="200" y="220" width="160" height="72" fill="#f4f4f5"/>
  <text x="280" y="252" text-anchor="middle" class="sub">Feed B</text>
  <text x="280" y="274" text-anchor="middle" class="sub">story 2</text>

  <rect x="320" y="220" width="160" height="72" fill="#f4f4f5"/>
  <text x="400" y="252" text-anchor="middle" class="sub">Feed C</text>
  <text x="400" y="274" text-anchor="middle" class="sub">story 3</text>

  <rect x="440" y="220" width="160" height="72" fill="#f4f4f5"/>
  <text x="520" y="252" text-anchor="middle" class="sub">Feed D</text>
  <text x="520" y="274" text-anchor="middle" class="sub">story 4</text>

  <rect x="560" y="220" width="160" height="72" fill="#f4f4f5"/>
  <text x="640" y="252" text-anchor="middle" class="sub">Feed E</text>
  <text x="640" y="274" text-anchor="middle" class="sub">story 5</text>

  <text x="400" y="340" text-anchor="middle" class="sub">More sources. Less shared picture.</text>
  <text x="400" y="384" text-anchor="middle" class="note">veda.ng/plurality</text>
</svg>
