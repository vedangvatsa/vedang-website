<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" preserveAspectRatio="xMidYMid meet">
  <style>
    text { font-family: Inter, system-ui, sans-serif; }
    .title { font-size: 22px; font-weight: 700; fill: #18181b; }
    .label { font-size: 22px; font-weight: 700; fill: #18181b; }
    .sub { font-size: 14px; fill: #52525b; }
    .note { font-size: 12px; fill: #71717a; }
  </style>
  <rect width="800" height="400" fill="#ffffff"/>

  <text x="400" y="44" text-anchor="middle" class="title">Pages for people, APIs for machines</text>

  <rect x="40" y="72" width="320" height="148" fill="#f4f4f5"/>
  <text x="200" y="138" text-anchor="middle" class="label">Pages</text>
  <text x="200" y="168" text-anchor="middle" class="sub">HTML, ads, checkout</text>

  <rect x="440" y="72" width="320" height="148" fill="#f4f4f5"/>
  <text x="600" y="138" text-anchor="middle" class="label">APIs</text>
  <text x="600" y="168" text-anchor="middle" class="sub">JSON, schema, token</text>

  <line x1="200" y1="220" x2="200" y2="268" stroke="#18181b" stroke-width="1.5"/>
  <line x1="600" y1="220" x2="600" y2="268" stroke="#18181b" stroke-width="1.5"/>
  <line x1="200" y1="268" x2="600" y2="268" stroke="#18181b" stroke-width="1.5"/>
  <line x1="400" y1="268" x2="400" y2="292" stroke="#18181b" stroke-width="1.5"/>

  <rect x="250" y="292" width="300" height="64" fill="#ffffff" stroke="#18181b" stroke-width="1.5"/>
  <text x="400" y="332" text-anchor="middle" class="label">Same database</text>

  <text x="400" y="384" text-anchor="middle" class="note">veda.ng/postinterface</text>
</svg>
