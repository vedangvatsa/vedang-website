<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" preserveAspectRatio="xMidYMid meet">
  <style>
    text { font-family: Inter, system-ui, sans-serif; }
    .title { font-size: 20px; font-weight: 700; fill: #18181b; }
    .label { font-size: 18px; font-weight: 700; fill: #18181b; }
    .sub { font-size: 13px; fill: #52525b; }
    .sink { font-size: 20px; font-weight: 700; fill: #18181b; }
    .note { font-size: 11px; fill: #71717a; }
  </style>
  <rect width="800" height="400" fill="#ffffff"/>

  <text x="400" y="38" text-anchor="middle" class="title">When a wage stops, three things can replace it</text>

  <rect x="40" y="72" width="224" height="140" fill="#f4f4f5" stroke="#e3e3e0" stroke-width="1"/>
  <text x="152" y="132" text-anchor="middle" class="label">Another Job</text>
  <text x="152" y="154" text-anchor="middle" class="sub">New paycheck</text>
  <text x="152" y="171" text-anchor="middle" class="sub">(reinstatement)</text>

  <rect x="288" y="72" width="224" height="140" fill="#f4f4f5" stroke="#e3e3e0" stroke-width="1"/>
  <text x="400" y="132" text-anchor="middle" class="label">Transfer</text>
  <text x="400" y="154" text-anchor="middle" class="sub">UI, SNAP, equity,</text>
  <text x="400" y="171" text-anchor="middle" class="sub">or public dividend</text>

  <rect x="536" y="72" width="224" height="140" fill="#f4f4f5" stroke="#e3e3e0" stroke-width="1"/>
  <text x="648" y="132" text-anchor="middle" class="label">Funded Agent</text>
  <text x="648" y="154" text-anchor="middle" class="sub">Capital income</text>
  <text x="648" y="171" text-anchor="middle" class="sub">with a mandate</text>

  <line x1="152" y1="212" x2="152" y2="264" stroke="#18181b" stroke-width="2"/>
  <line x1="400" y1="212" x2="400" y2="264" stroke="#18181b" stroke-width="2"/>
  <line x1="648" y1="212" x2="648" y2="264" stroke="#18181b" stroke-width="2"/>
  
  <line x1="152" y1="264" x2="648" y2="264" stroke="#18181b" stroke-width="2"/>
  <line x1="400" y1="264" x2="400" y2="292" stroke="#18181b" stroke-width="2"/>

  <rect x="260" y="292" width="280" height="72" fill="#ffffff" stroke="#18181b" stroke-width="2"/>
  <text x="400" y="338" text-anchor="middle" class="sink">Consumer Receipt</text>

  <text x="400" y="385" text-anchor="middle" class="note">veda.ng/receipts</text>
</svg>
