<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" preserveAspectRatio="xMidYMid meet">
  <style>
    text { font-family: Inter, system-ui, sans-serif; }
    .title { font-size: 22px; font-weight: 700; fill: #18181b; }
    .label { font-size: 22px; font-weight: 700; fill: #18181b; }
    .sub { font-size: 14px; fill: #52525b; }
    .sink { font-size: 22px; font-weight: 700; fill: #18181b; }
    .note { font-size: 12px; fill: #71717a; }
  </style>
  <rect width="800" height="400" fill="#ffffff"/>

  <text x="400" y="44" text-anchor="middle" class="title">When a wage stops</text>

  <rect x="40" y="72" width="224" height="148" fill="#f4f4f5"/>
  <text x="152" y="138" text-anchor="middle" class="label">Job</text>
  <text x="152" y="168" text-anchor="middle" class="sub">Another paycheck</text>

  <rect x="288" y="72" width="224" height="148" fill="#f4f4f5"/>
  <text x="400" y="138" text-anchor="middle" class="label">Transfer</text>
  <text x="400" y="168" text-anchor="middle" class="sub">UI, SNAP, equity</text>

  <rect x="536" y="72" width="224" height="148" fill="#f4f4f5"/>
  <text x="648" y="138" text-anchor="middle" class="label">Agent</text>
  <text x="648" y="168" text-anchor="middle" class="sub">A funded mandate</text>

  <line x1="152" y1="220" x2="152" y2="268" stroke="#18181b" stroke-width="1.5"/>
  <line x1="400" y1="220" x2="400" y2="268" stroke="#18181b" stroke-width="1.5"/>
  <line x1="648" y1="220" x2="648" y2="268" stroke="#18181b" stroke-width="1.5"/>
  <line x1="152" y1="268" x2="648" y2="268" stroke="#18181b" stroke-width="1.5"/>
  <line x1="400" y1="268" x2="400" y2="292" stroke="#18181b" stroke-width="1.5"/>

  <rect x="250" y="292" width="300" height="64" fill="#ffffff" stroke="#18181b" stroke-width="1.5"/>
  <text x="400" y="332" text-anchor="middle" class="sink">Receipt</text>

  <text x="400" y="384" text-anchor="middle" class="note">veda.ng/receipts</text>
