<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 548" width="400" height="548" preserveAspectRatio="xMidYMid meet">
  <style>
    text { font-family: Inter, system-ui, sans-serif; }
    .title { font-size: 16px; font-weight: 600; fill: #18181b; }
    .name { font-size: 15px; font-weight: 600; fill: #18181b; }
    .row { font-size: 13px; fill: #18181b; }
    .dim { font-size: 13px; fill: #52525b; }
    .note { font-size: 12px; fill: #52525b; }
  </style>

  <text x="16" y="28" class="title">Staff, cash, and who can fine</text>

  <rect x="16" y="44" width="368" height="72" fill="#f4f4f5"/>
  <text x="28" y="66" class="name">UK AISI</text>
  <text x="372" y="66" class="dim" text-anchor="end">Fine: No</text>
  <text x="28" y="86" class="row">100+ technical staff</text>
  <text x="28" y="106" class="row">£100M envelope to 2030</text>

  <rect x="16" y="116" width="368" height="72" fill="#ffffff"/>
  <text x="28" y="138" class="name">US CAISI (NIST)</text>
  <text x="372" y="138" class="dim" text-anchor="end">Fine: No</text>
  <text x="28" y="158" class="dim">Headcount unpublished</text>
  <text x="28" y="178" class="row">~$15M FY2026</text>

  <rect x="16" y="188" width="368" height="72" fill="#f4f4f5"/>
  <text x="28" y="210" class="name">EU AI Office</text>
  <text x="372" y="210" class="row" text-anchor="end">Fine: Yes</text>
  <text x="28" y="230" class="row">125+, hiring 40 more</text>
  <text x="28" y="250" class="row">€46.5M setup (2024)</text>

  <rect x="16" y="260" width="368" height="72" fill="#ffffff"/>
  <text x="28" y="282" class="name">Japan J-AISI</text>
  <text x="372" y="282" class="dim" text-anchor="end">Fine: No</text>
  <text x="28" y="302" class="row">About 23 staff</text>
  <text x="28" y="322" class="dim">Plan to double. Cash unpublished</text>

  <rect x="16" y="332" width="368" height="72" fill="#f4f4f5"/>
  <text x="28" y="354" class="name">Singapore AISI</text>
  <text x="372" y="354" class="dim" text-anchor="end">Fine: No</text>
  <text x="28" y="374" class="dim">Headcount unpublished</text>
  <text x="28" y="394" class="row">S$10M/year reported</text>

  <rect x="16" y="404" width="368" height="72" fill="#ffffff"/>
  <text x="28" y="426" class="name">India Safety Institute</text>
  <text x="372" y="426" class="dim" text-anchor="end">Fine: No</text>
  <text x="28" y="446" class="dim">Announced Jan 2025</text>
  <text x="28" y="466" class="dim">₹20.46 Cr Safe &amp; Trusted pillar</text>

  <text x="16" y="516" class="note">Only the AI Office sits on a statute that can</text>
  <text x="16" y="536" class="note">restrict a model and issue a fine.</text>
</svg>
