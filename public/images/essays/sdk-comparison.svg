<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 316" width="680" height="316">
  <style>
    text { font-family: Inter, system-ui, sans-serif; }
    .title { font-size: 14px; font-weight: 600; fill: #18181b; }
    .label { font-size: 12px; fill: #18181b; font-weight: 500; }
    .value { font-size: 11px; fill: #18181b; font-weight: 600; }
    .num { font-size: 10px; fill: #71717a; }
    .note { font-size: 10px; fill: #52525b; }
  </style>
  <!-- Title -->
  <text x="40" y="30" class="title">Monthly SDK Downloads (npm and pypi), 30 days to 9 August 2026</text>
  
  <!-- npm section -->
  <text x="40" y="58" class="label">npm</text>
  <!-- MCP bar -->
  <rect x="120" y="44" width="420" height="16" rx="2" fill="#18181b"/>
  <text x="546" y="57" class="value">198M</text>
  <text x="120" y="76" class="num">@modelcontextprotocol/sdk</text>
  <!-- A2A bar -->
  <rect x="120" y="84" width="2" height="16" rx="2" fill="#d4d4d8"/>
  <text x="128" y="97" class="num">a2a (803)</text>
  
  <!-- pypi section -->
  <text x="40" y="130" class="label">pypi</text>
  <!-- MCP bar -->
  <rect x="120" y="116" width="420" height="16" rx="2" fill="#18181b"/>
  <text x="546" y="129" class="value">328M</text>
  <text x="120" y="148" class="num">mcp</text>
  <!-- A2A bar -->
  <rect x="120" y="156" width="18" height="16" rx="2" fill="#d4d4d8"/>
  <text x="144" y="169" class="num">a2a-sdk (14M)</text>
  
  <!-- Reference bars -->
  <text x="40" y="210" class="label" fill="#71717a">Reference (pypi)</text>
  <!-- anthropic -->
  <rect x="120" y="196" width="246" height="14" rx="2" fill="#d4d4d8"/>
  <text x="372" y="208" class="num">anthropic 192M</text>
  <!-- openai-agents -->
  <rect x="120" y="216" width="47" height="14" rx="2" fill="#d4d4d8"/>
  <text x="173" y="228" class="num">openai-agents 37M</text>
  
  <!-- Source -->
  <text x="40" y="265" class="note">Sources: npm downloads API, pypistats API. Queried 9-11 August 2026.</text>
  <text x="40" y="282" class="note">Download counts include CI pipelines, automated builds, and cache misses. Relative order of magnitude is the signal.</text>
  <text x="40" y="300" class="note">The A2A npm package had 803 downloads. MCP npm: 198,046,096. The difference is five orders of magnitude.</text>
</svg>