<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="680" height="400">
  <style>
    text { font-family: Inter, system-ui, sans-serif; }
    .title { font-size: 14px; font-weight: 600; fill: #18181b; }
    .label { font-size: 12px; fill: #18181b; font-weight: 600; }
    .amount { font-size: 12px; font-weight: 600; fill: #18181b; }
    .detail { font-size: 11px; fill: #52525b; }
    .note { font-size: 10px; fill: #52525b; }
  </style>

  <text x="40" y="28" class="title">Stargate: Announced, committed, funded, spent ($ billions)</text>

  <text x="40" y="56" class="label">Announced ceiling (Jan 2025)</text>
  <rect x="40" y="64" width="520" height="18" rx="3" fill="#d4d4d8"/>
  <text x="568" y="78" class="amount">$500B</text>
  <text x="40" y="98" class="detail">By 2029. Reuters / White House press conference.</text>

  <text x="40" y="128" class="label">Committed initial frame (Jan 2025)</text>
  <rect x="40" y="136" width="104" height="18" rx="3" fill="#a1a1aa"/>
  <text x="152" y="150" class="amount">$100B</text>
  <text x="40" y="170" class="detail">SoftBank $19B, OpenAI $19B, Oracle $7B, MGX $7B. The Information.</text>

  <text x="40" y="200" class="label">Funded (Apr-Aug 2025)</text>
  <rect x="40" y="208" width="40" height="18" rx="3" fill="#52525b"/>
  <text x="88" y="222" class="amount">~$38B</text>
  <text x="40" y="242" class="detail">Mizuho $10B expected. JPMorgan $2.3B Abilene loan. WSJ, Bloomberg.</text>

  <text x="40" y="272" class="label">Spent (as of Aug 2025)</text>
  <rect x="40" y="280" width="6" height="18" rx="2" fill="#18181b"/>
  <text x="54" y="294" class="amount">$0</text>
  <text x="40" y="314" class="detail">Project not started. No funds raised for the $500B budget. Bloomberg, 7 Aug 2025.</text>

  <line x1="40" y1="332" x2="640" y2="332" stroke="#e4e4e7" stroke-width="1"/>
  <text x="40" y="352" class="note">Sep 2025: OpenAI listed five new sites and $400B over three years. That is a plan, not funded capital.</text>
  <text x="40" y="370" class="note">The $2.3B JPMorgan loan is for an Oracle-leased Texas campus, not a Stargate LLC equity close.</text>
  <text x="40" y="388" class="note">All figures from public reporting. The $500B number is a ceiling to 2029.</text>
</svg>
