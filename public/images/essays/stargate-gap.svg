<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 380" width="400" height="380" preserveAspectRatio="xMidYMid meet">
  <style>
    text { font-family: Inter, system-ui, sans-serif; }
    .title { font-size: 16px; font-weight: 600; fill: #18181b; }
    .label { font-size: 14px; fill: #18181b; font-weight: 600; }
    .amount { font-size: 18px; font-weight: 700; fill: #18181b; }
    .note { font-size: 12px; fill: #52525b; }
  </style>

  <text x="16" y="28" class="title">Stargate: ceiling vs cash ($B)</text>

  <text x="16" y="60" class="label">Announced ceiling (Jan 2025)</text>
  <text x="384" y="60" class="amount" text-anchor="end">$500B</text>
  <rect x="16" y="68" width="368" height="16" rx="3" fill="#d4d4d8"/>

  <text x="16" y="112" class="label">Committed initial frame</text>
  <text x="384" y="112" class="amount" text-anchor="end">$100B</text>
  <rect x="16" y="120" width="74" height="16" rx="3" fill="#a1a1aa"/>

  <text x="16" y="164" class="label">Funded (Apr-Aug 2025)</text>
  <text x="384" y="164" class="amount" text-anchor="end">~$38B</text>
  <rect x="16" y="172" width="28" height="16" rx="3" fill="#52525b"/>

  <text x="16" y="216" class="label">Spent (as of Aug 2025)</text>
  <text x="384" y="216" class="amount" text-anchor="end">$0</text>
  <rect x="16" y="224" width="6" height="16" rx="2" fill="#18181b"/>

  <text x="16" y="268" class="note">$500B is a ceiling to 2029, not cash in hand.</text>
  <text x="16" y="288" class="note">Sep 2025: OpenAI listed five sites and $400B</text>
  <text x="16" y="306" class="note">over three years. That is a plan, not funded capital.</text>
  <text x="16" y="332" class="note">The $2.3B JPMorgan loan is for an Oracle-leased</text>
  <text x="16" y="350" class="note">Texas campus, not a Stargate LLC equity close.</text>
  <text x="16" y="370" class="note">Bloomberg, 7 Aug 2025: project not started.</text>
</svg>
