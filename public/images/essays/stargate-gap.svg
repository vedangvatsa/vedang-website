<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" width="680" height="380">
  <style>
    text { font-family: Inter, system-ui, sans-serif; }
    .title { font-size: 14px; font-weight: 600; fill: #18181b; }
    .label { font-size: 12px; fill: #18181b; font-weight: 500; }
    .detail { font-size: 10px; fill: #71717a; }
    .note { font-size: 10px; fill: #a1a1aa; }
    .marker { font-size: 10px; fill: #71717a; }
  </style>

  <!-- Title -->
  <text x="40" y="30" class="title">Stargate: Announced → Committed → Funded → Spent ($ Billions)</text>

  <!-- Announced -->
  <rect x="40" y="50" width="560" height="28" rx="3" fill="#d4d4d8"/>
  <text x="56" y="69" class="label">Announced ceiling (Jan 2025)</text>
  <text x="360" y="69" class="detail">$500B by 2029. Source: Reuters, White House press conference.</text>
  <text x="610" y="69" class="marker">$500B</text>

  <!-- Committed (initial) -->
  <rect x="40" y="90" width="112" height="28" rx="3" fill="#a1a1aa"/>
  <text x="56" y="109" class="label">Committed (Jan 2025)</text>
  <text x="200" y="109" class="detail">SoftBank $19B, OpenAI $19B, Oracle $7B, MGX $7B. Source: The Information.</text>
  <text x="160" y="109" class="marker">$100B</text>

  <!-- Funded (reported) -->
  <rect x="40" y="130" width="44" height="28" rx="3" fill="#71717a"/>
  <text x="56" y="149" class="label">Funded (Apr-Aug 2025)</text>
  <text x="140" y="149" class="detail">Mizuho $10B expected. JPMorgan $2.3B lent for Abilene. Source: WSJ, Bloomberg.</text>
  <text x="92" y="149" class="marker">~$38B</text>

  <!-- Spent -->
  <rect x="40" y="170" width="3" height="28" rx="3" fill="#18181b"/>
  <text x="52" y="189" class="label">Spent (as of Aug 2025)</text>
  <text x="110" y="189" class="detail">Project not started. No funds raised for the $500B budget. Source: Bloomberg.</text>
  <text x="52" y="205" class="marker" fill="#18181b">$0</text>

  <!-- Timeline annotations -->
  <line x1="40" y1="230" x2="640" y2="230" stroke="#e4e4e7" stroke-width="1"/>

  <text x="40" y="252" class="detail" fill="#a1a1aa">Jan 21, 2025 — White House announcement. Jan 23 — Funding structure reported.</text>
  <text x="40" y="268" class="detail" fill="#a1a1aa">Apr 2025 — WSJ reports SoftBank 10% equity, rest debt. May — JPMorgan $2.3B loan.</text>
  <text x="40" y="284" class="detail" fill="#a1a1aa">Aug 7, 2025 — Bloomberg: project not started, no funds raised toward $500B.</text>
  <text x="40" y="300" class="detail" fill="#a1a1aa">Sep 23, 2025 — OpenAI announces 5 new sites, $400B over three years.</text>

  <text x="40" y="330" class="note">All figures are from public reporting. The $500B ceiling has not been raised.</text>
  <text x="40" y="346" class="note">The $2.3B JPMorgan loan is for a data centre leased to Oracle, not directly to Stargate LLC.</text>
</svg>