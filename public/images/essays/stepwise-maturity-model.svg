<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; rx: 8px; }
      .card { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; rx: 6px; }
      .card-active { fill: #ffffff; stroke: #6366f1; stroke-width: 2; rx: 6px; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 600; fill: #64748b; letter-spacing: 0.1em; text-transform: uppercase; }
      .stage-title { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #0f172a; }
      .stage-meta { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 600; fill: #6366f1; }
      .stage-desc { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #475569; line-height: 1.5; }
      .badge { fill: #f1f5f9; rx: 4px; }
      .badge-text { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; font-weight: 700; fill: #475569; }
      .badge-active { fill: #eef2ff; rx: 4px; }
      .badge-active-text { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; font-weight: 700; fill: #4f46e5; }
    </style>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="800" height="460" class="bg" />

  <!-- Header -->
  <text x="32" y="42" class="title">The Stepwise AI Maturity Model</text>
  <text x="32" y="60" class="subtitle">FOUR PHASES OF ENTERPRISE AI ADOPTION</text>

  <!-- Stage 1 -->
  <g transform="translate(32, 80)">
    <rect x="0" y="0" width="736" height="74" class="card" />
    <rect x="646" y="12" width="76" height="22" class="badge" />
    <text x="684" y="27" text-anchor="middle" class="badge-text">STAGE 1</text>
    <text x="20" y="28" class="stage-title">Stage 1: Ad-hoc Discovery</text>
    <text x="20" y="46" class="stage-meta">1–3 months • Low Impact</text>
    <text x="220" y="46" class="stage-desc">Isolated tools. Individuals using chat interfaces. No core structural integration.</text>
  </g>

  <!-- Stage 2 -->
  <g transform="translate(32, 168)">
    <rect x="0" y="0" width="736" height="74" class="card" />
    <rect x="646" y="12" width="76" height="22" class="badge" />
    <text x="684" y="27" text-anchor="middle" class="badge-text">STAGE 2</text>
    <text x="20" y="28" class="stage-title">Stage 2: Active Pilot</text>
    <text x="20" y="46" class="stage-meta">3–6 months • Medium Impact</text>
    <text x="220" y="46" class="stage-desc">Specific tasks automated via API. Off-the-shelf bots handling narrow workflows.</text>
  </g>

  <!-- Stage 3 -->
  <g transform="translate(32, 256)">
    <rect x="0" y="0" width="736" height="74" class="card" />
    <rect x="646" y="12" width="76" height="22" class="badge" />
    <text x="684" y="27" text-anchor="middle" class="badge-text">STAGE 3</text>
    <text x="20" y="28" class="stage-title">Stage 3: Operational</text>
    <text x="20" y="46" class="stage-meta">6–12 months • High Impact</text>
    <text x="220" y="46" class="stage-desc">AI integrated natively. RAG systems reading internal databases. Approvals remain manual.</text>
  </g>

  <!-- Stage 4 -->
  <g transform="translate(32, 344)">
    <rect x="0" y="0" width="736" height="78" class="card-active" />
    <rect x="646" y="12" width="76" height="22" class="badge-active" />
    <text x="684" y="27" text-anchor="middle" class="badge-active-text">STAGE 4</text>
    <text x="20" y="28" class="stage-title">Stage 4: Systemic</text>
    <text x="20" y="46" class="stage-meta">12+ months • Transformational</text>
    <text x="220" y="46" class="stage-desc">Agent-to-agent operations. Autonomous execution of core strategic functions.</text>
  </g>
</svg>
