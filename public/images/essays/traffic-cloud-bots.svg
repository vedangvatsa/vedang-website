<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="400" height="280" preserveAspectRatio="xMidYMid meet">
  <style>
    text { font-family: Inter, system-ui, sans-serif; }
    .title { font-size: 16px; font-weight: 600; fill: #18181b; }
    .label { font-size: 14px; fill: #18181b; font-weight: 500; }
    .pct { font-size: 16px; fill: #18181b; font-weight: 700; }
    .note { font-size: 12px; fill: #52525b; }
  </style>

  <text x="16" y="28" class="title">Bot traffic by cloud, August 2026</text>

  <text x="16" y="64" class="label">AWS</text>
  <text x="384" y="64" class="pct" text-anchor="end">14.7%</text>
  <rect x="16" y="72" width="270" height="16" rx="3" fill="#18181b" opacity="0.85"/>

  <text x="16" y="112" class="label">Microsoft</text>
  <text x="384" y="112" class="pct" text-anchor="end">9.0%</text>
  <rect x="16" y="120" width="165" height="16" rx="3" fill="#18181b" opacity="0.65"/>

  <text x="16" y="160" class="label">Google</text>
  <text x="384" y="160" class="pct" text-anchor="end">8.5%</text>
  <rect x="16" y="168" width="156" height="16" rx="3" fill="#18181b" opacity="0.50"/>

  <text x="16" y="208" class="label" fill="#71717a">All other ASNs</text>
  <text x="384" y="208" class="pct" fill="#71717a" text-anchor="end">67.8%</text>
  <rect x="16" y="216" width="368" height="16" rx="3" fill="#d4d4d8"/>

  <text x="16" y="256" class="note">Cloudflare Radar, 7 days to 12 August 2026.</text>
  <text x="16" y="272" class="note">Three clouds originate about 32% of bot traffic.</text>
</svg>
