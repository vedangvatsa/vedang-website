<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 258" width="680" height="258">
  <style>
    text { font-family: Inter, system-ui, sans-serif; }
    .title { font-size: 14px; font-weight: 600; fill: #18181b; }
    .label { font-size: 12px; fill: #18181b; font-weight: 500; }
    .pct { font-size: 12px; fill: #18181b; font-weight: 600; }
    .note { font-size: 10px; fill: #52525b; }
  </style>

  <text x="40" y="30" class="title">Bot Traffic Origination by Cloud Provider, August 2026</text>

  <!-- AWS -->
  <text x="40" y="70" class="label">AWS</text>
  <rect x="160" y="56" width="308" height="18" rx="3" fill="#18181b" opacity="0.85"/>
  <text x="474" y="70" class="pct">14.7%</text>

  <!-- Microsoft -->
  <text x="40" y="108" class="label">Microsoft</text>
  <rect x="160" y="94" width="189" height="18" rx="3" fill="#18181b" opacity="0.65"/>
  <text x="355" y="108" class="pct">9.0%</text>

  <!-- Google -->
  <text x="40" y="146" class="label">Google</text>
  <rect x="160" y="132" width="178" height="18" rx="3" fill="#18181b" opacity="0.50"/>
  <text x="344" y="146" class="pct">8.5%</text>

  <!-- Others -->
  <text x="40" y="184" class="label" fill="#71717a">All other ASNs</text>
  <rect x="160" y="170" width="420" height="18" rx="3" fill="#d4d4d8"/>
  <text x="586" y="184" class="pct" fill="#71717a">67.8%</text>

  <text x="40" y="225" class="note">Source: Cloudflare Radar, 7-day window to 12 August 2026. radar.cloudflare.com/bots</text>
  <text x="40" y="242" class="note">AWS combines two AS numbers totalling 14.7%. Three cloud providers originate approximately 32% of global bot traffic.</text>
</svg>
