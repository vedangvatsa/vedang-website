<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" preserveAspectRatio="xMidYMid meet">
  <style>
    text { font-family: Inter, system-ui, sans-serif; }
    .title { font-size: 16px; font-weight: 600; fill: #18181b; }
    .label { font-size: 14px; fill: #18181b; font-weight: 500; }
    .pct { font-size: 16px; fill: #18181b; font-weight: 700; }
    .note { font-size: 12px; fill: #52525b; }
  </style>

  <text x="16" y="28" class="title">Verified bot traffic, 2025</text>

  <text x="16" y="64" class="label">Search engine crawlers</text>
  <text x="384" y="64" class="pct" text-anchor="end">40%</text>
  <rect x="16" y="72" width="368" height="16" rx="3" fill="#18181b" opacity="0.85"/>

  <text x="16" y="116" class="label">AI crawlers</text>
  <text x="384" y="116" class="pct" text-anchor="end">20%</text>
  <rect x="16" y="124" width="184" height="16" rx="3" fill="#18181b" opacity="0.55"/>

  <text x="16" y="168" class="label">SEO and marketing bots</text>
  <text x="384" y="168" class="pct" text-anchor="end">13%</text>
  <rect x="16" y="176" width="120" height="16" rx="3" fill="#18181b" opacity="0.35"/>

  <text x="16" y="220" class="label">Other verified bots</text>
  <text x="384" y="220" class="pct" text-anchor="end">27%</text>
  <rect x="16" y="228" width="249" height="16" rx="3" fill="#d4d4d8"/>

  <text x="16" y="268" class="note">Cloudflare 2025 Year in Review.</text>
  <text x="16" y="288" class="note">Googlebot: more than a quarter of verified bots.</text>
</svg>
