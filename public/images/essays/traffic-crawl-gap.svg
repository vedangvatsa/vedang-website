<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 420" width="400" height="420" preserveAspectRatio="xMidYMid meet">
  <style>
    text { font-family: Inter, system-ui, sans-serif; }
    .title { font-size: 16px; font-weight: 600; fill: #18181b; }
    .name { font-size: 15px; font-weight: 600; fill: #18181b; }
    .gap { font-size: 18px; font-weight: 700; fill: #18181b; }
    .dim { font-size: 13px; fill: #52525b; }
    .note { font-size: 12px; fill: #52525b; }
  </style>

  <text x="16" y="28" class="title">Pages crawled per referred visitor</text>

  <rect x="16" y="44" width="368" height="48" fill="#f4f4f5"/>
  <text x="28" y="64" class="name">Anthropic Claude</text>
  <text x="372" y="64" class="dim" text-anchor="end">chatbot</text>
  <text x="28" y="84" class="gap">70,900 : 1</text>

  <rect x="16" y="92" width="368" height="48" fill="#ffffff"/>
  <text x="28" y="112" class="name">OpenAI ChatGPT</text>
  <text x="372" y="112" class="dim" text-anchor="end">chatbot</text>
  <text x="28" y="132" class="gap">3,700 : 1</text>

  <rect x="16" y="140" width="368" height="48" fill="#f4f4f5"/>
  <text x="28" y="160" class="name">Perplexity</text>
  <text x="372" y="160" class="dim" text-anchor="end">AI search</text>
  <text x="28" y="180" class="gap">200 : 1</text>

  <rect x="16" y="188" width="368" height="48" fill="#ffffff"/>
  <text x="28" y="208" class="name">Microsoft Bing</text>
  <text x="372" y="208" class="dim" text-anchor="end">search</text>
  <text x="28" y="228" class="gap">60 : 1</text>

  <rect x="16" y="236" width="368" height="48" fill="#f4f4f5"/>
  <text x="28" y="256" class="name">Google</text>
  <text x="372" y="256" class="dim" text-anchor="end">search</text>
  <text x="28" y="276" class="gap">3 : 1</text>

  <rect x="16" y="284" width="368" height="48" fill="#ffffff"/>
  <text x="28" y="304" class="name">DuckDuckGo</text>
  <text x="372" y="304" class="dim" text-anchor="end">search</text>
  <text x="28" y="324" class="gap">&lt; 1 : 1</text>

  <text x="16" y="360" class="note">Cloudflare, 19-26 June 2025.</text>
  <text x="16" y="380" class="note">Anthropic's app often omits referrer headers.</text>
  <text x="16" y="408" class="note">Chatbots crawl far more pages per referral than search.</text>
</svg>
