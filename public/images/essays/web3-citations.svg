<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="400" height="260" preserveAspectRatio="xMidYMid meet">
  <style>
    text { font-family: Inter, system-ui, sans-serif; }
    .title { font-size: 16px; font-weight: 600; fill: #18181b; }
    .label { font-size: 14px; fill: #18181b; font-weight: 500; }
    .pct { font-size: 16px; fill: #18181b; font-weight: 700; }
    .note { font-size: 12px; fill: #52525b; }
  </style>

  <text x="16" y="26" class="title">Citations per paper</text>

  <text x="16" y="60" class="label">Zero citations</text>
  <text x="384" y="60" class="pct" text-anchor="end">43.5%</text>
  <rect x="16" y="68" width="368" height="16" rx="3" fill="#18181b" opacity="0.85"/>

  <text x="16" y="108" class="label">1 to 13 citations</text>
  <text x="384" y="108" class="pct" text-anchor="end">31.5%</text>
  <rect x="16" y="116" width="266" height="16" rx="3" fill="#18181b" opacity="0.5"/>

  <text x="16" y="156" class="label">14 to 41 citations</text>
  <text x="384" y="156" class="pct" text-anchor="end">20%</text>
  <rect x="16" y="164" width="169" height="16" rx="3" fill="#d4d4d8"/>

  <text x="16" y="204" class="label">42 or more</text>
  <text x="384" y="204" class="pct" text-anchor="end">5%</text>
  <rect x="16" y="212" width="42" height="16" rx="3" fill="#d4d4d8"/>

  <text x="16" y="248" class="note">82.7% of papers are from 2020 on. New papers have had less time.</text>
</svg>
