<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="400" height="280" preserveAspectRatio="xMidYMid meet">
  <style>
    text { font-family: Inter, system-ui, sans-serif; }
    .title { font-size: 16px; font-weight: 600; fill: #18181b; }
    .label { font-size: 14px; fill: #18181b; font-weight: 500; }
    .pct { font-size: 14px; fill: #18181b; font-weight: 700; }
    .note { font-size: 12px; fill: #52525b; }
  </style>

  <text x="16" y="26" class="title">Where the papers are from</text>

  <text x="16" y="60" class="label">China</text>
  <text x="384" y="60" class="pct" text-anchor="end">17,258  13.5%</text>
  <rect x="16" y="68" width="368" height="14" rx="2" fill="#18181b"/>

  <text x="16" y="108" class="label">India</text>
  <text x="384" y="108" class="pct" text-anchor="end">17,037  13.3%</text>
  <rect x="16" y="116" width="363" height="14" rx="2" fill="#18181b" opacity="0.75"/>

  <text x="16" y="156" class="label">United States</text>
  <text x="384" y="156" class="pct" text-anchor="end">12,488  9.7%</text>
  <rect x="16" y="164" width="266" height="14" rx="2" fill="#18181b" opacity="0.45"/>

  <text x="16" y="204" class="label">Indonesia</text>
  <text x="384" y="204" class="pct" text-anchor="end">3,106  rank 6</text>
  <rect x="16" y="212" width="66" height="14" rx="2" fill="#d4d4d8"/>

  <text x="16" y="248" class="note">A paper with authors in two countries counts twice.</text>
  <text x="16" y="268" class="note">Saudi Arabia is rank 10 with 2,423 papers.</text>
</svg>
