<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" preserveAspectRatio="xMidYMid meet">
  <style>
    text { font-family: Inter, system-ui, sans-serif; }
    .title { font-size: 16px; font-weight: 600; fill: #18181b; }
    .head { font-size: 13px; font-weight: 700; fill: #18181b; }
    .num { font-size: 28px; font-weight: 700; fill: #18181b; }
    .dim { font-size: 12px; fill: #52525b; }
    .note { font-size: 12px; fill: #52525b; }
  </style>

  <text x="16" y="26" class="title">Abstract mentions, not market cap</text>

  <rect x="16" y="44" width="176" height="196" fill="#f4f4f5"/>
  <text x="28" y="68" class="head">DeFi</text>
  <text x="28" y="108" class="num">516</text>
  <text x="28" y="128" class="dim">papers in 2025</text>
  <text x="28" y="156" class="dim">7 papers in 2019</text>
  <text x="28" y="176" class="dim">12 in 2020</text>
  <text x="28" y="196" class="dim">63 in 2021</text>
  <text x="28" y="220" class="head">74x in six years</text>

  <rect x="208" y="44" width="176" height="196" fill="#ffffff" stroke="#e4e4e7"/>
  <text x="220" y="68" class="head">NFT</text>
  <text x="220" y="108" class="num">426</text>
  <text x="220" y="128" class="dim">peak in 2023</text>
  <text x="220" y="156" class="dim">60 papers in 2021</text>
  <text x="220" y="176" class="dim">334 in 2024</text>
  <text x="220" y="196" class="dim">366 in 2025</text>
  <text x="220" y="220" class="head">down after 2023</text>

  <text x="16" y="268" class="note">Tagged OpenAlex papers, pull date 12 June 2026.</text>
  <text x="16" y="288" class="note">A mention is a word in an abstract, not a protocol.</text>
</svg>
