[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vedang-cli"
version = "0.1.2"
description = "CLI client for veda.ng — AI agents, Web3 research, MCP server, and agent-readiness scanning"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Vedang Vatsa", email = "vatsvedang@gmail.com"}]
maintainers = [{name = "Vedang Vatsa", email = "vatsvedang@gmail.com"}]
keywords = ["cli", "ai-agents", "web3", "mcp", "ora", "agent-readiness", "veda-ng"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.27",
    "click>=8.1",
    "rich>=13.7",
    "pydantic>=2.8",
    "python-dotenv>=1.0",
]
optional-dependencies = { dev = ["pytest>=8.2", "ruff>=0.5", "mypy>=1.10", "pytest-httpx>=0.27"], mcp = ["mcp>=1.0"] }

[project.urls]
Homepage = "https://veda.ng"
Repository = "https://github.com/vedangvatsa/vedang-website"
Issues = "https://github.com/vedangvatsa/vedang-website/issues"
Documentation = "https://veda.ng/developers"

[project.scripts]
vedang = "vedang_cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["vedang_cli*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true