<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1080px;
    height: 1920px;
    background: #080A10;
    font-family: 'Inter', -apple-system, system-ui, sans-serif;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* ── SCENE IMAGE ─────────────────────────────── */
  .scene-image {
    position: absolute;
    top: 0; left: 0;
    width: 1080px;
    height: 1120px;
    overflow: hidden;
  }
  .scene-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: saturate(0.7) brightness(0.82);
  }
  .scene-image::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 400px;
    background: linear-gradient(to top, #080A10 0%, #080A10 15%, transparent 100%);
  }
  .scene-image::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 120px;
    background: linear-gradient(to bottom, rgba(8,10,16,0.6), transparent);
    z-index: 1;
  }

  /* ── TOP BAR ─────────────────────────────────── */
  .top-bar {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
    background: #0096FF;
    z-index: 10;
  }

  .brand {
    position: absolute;
    top: 20px; left: 48px;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .brand-name {
    font-size: 24px;
    font-weight: 800;
    color: #0096FF;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  .brand-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #FF3340;
    box-shadow: 0 0 8px #FF3340;
  }
  .brand-live {
    font-size: 14px;
    font-weight: 700;
    color: #FF3340;
    letter-spacing: 1px;
  }

  .date-tag {
    position: absolute;
    top: 22px; right: 48px;
    font-size: 18px;
    font-weight: 500;
    color: #4A5270;
    letter-spacing: 0.5px;
    z-index: 10;
  }

  /* ── HEADLINE ────────────────────────────────── */
  .headline-bar {
    position: absolute;
    top: 980px;
    left: 0;
    z-index: 5;
    display: flex;
    align-items: stretch;
  }
  .headline-accent {
    width: 5px;
    background: #F0F2FA;
  }
  .headline-text {
    background: #0096FF;
    padding: 14px 24px 14px 20px;
    font-size: 36px;
    font-weight: 800;
    color: #F0F2FA;
    letter-spacing: 0.5px;
    white-space: nowrap;
    box-shadow: 4px 4px 0 rgba(0,0,0,0.4);
  }

  /* ── CAPTION CARD ────────────────────────────── */
  .caption-card {
    position: absolute;
    left: 40px;
    right: 40px;
    top: 1140px;
    bottom: 160px;
    background: rgba(14, 16, 24, 0.92);
    border: 1px solid rgba(40, 46, 65, 0.5);
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 32px;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
  }
  .caption-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 12px;
    right: 12px;
    height: 2px;
    background: #0096FF;
    opacity: 0.6;
  }

  /* ── CAPTION TEXT ────────────────────────────── */
  .caption-text {
    text-align: center;
    line-height: 1.55;
    max-width: 920px;
  }
  .word {
    display: inline;
    font-size: 42px;
    font-weight: 700;
    transition: color 0.15s ease;
  }
  .word.active {
    color: #F0F2FA;
    background: #0096FF;
    padding: 2px 7px;
    border-radius: 5px;
    margin: 0 -3px;
  }
  .word.spoken {
    color: #B0B8D0;
  }
  .word.upcoming {
    color: #4A5270;
  }

  /* ── SOURCE ATTRIBUTION ──────────────────────── */
  .source {
    position: absolute;
    bottom: 1130px;
    right: 48px;
    font-size: 14px;
    font-weight: 500;
    color: rgba(255,255,255,0.3);
    z-index: 5;
  }

  /* ── PROGRESS BAR ────────────────────────────── */
  .progress-bar {
    position: absolute;
    bottom: 0; left: 0;
    height: 5px;
    background: linear-gradient(90deg, #0096FF, #00C8FF);
    z-index: 10;
    border-radius: 0 3px 0 0;
  }
  .progress-bg {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 5px;
    background: rgba(255,255,255,0.05);
    z-index: 9;
  }

  /* ── SCENE COUNTER ───────────────────────────── */
  .scene-counter {
    position: absolute;
    bottom: 24px;
    right: 48px;
    font-size: 16px;
    font-weight: 600;
    color: #4A5270;
    z-index: 10;
  }
</style>
</head>
<body>
  <div class="top-bar"></div>

  <div class="brand">
    <span class="brand-name">The Signal</span>
    <span class="brand-dot" id="liveDot"></span>
    <span class="brand-live">LIVE</span>
  </div>

  <div class="date-tag">MAY 22, 2026</div>

  <div class="scene-image">
    <img id="sceneImg" src="" alt="">
  </div>

  <div class="source" id="sourceText"></div>

  <div class="headline-bar" id="headlineBar" style="display:none;">
    <div class="headline-accent"></div>
    <div class="headline-text" id="headlineText"></div>
  </div>

  <div class="caption-card">
    <div class="caption-text" id="captionText"></div>
  </div>

  <div class="scene-counter" id="sceneCounter"></div>
  <div class="progress-bg"></div>
  <div class="progress-bar" id="progressBar"></div>
</body>
</html>
